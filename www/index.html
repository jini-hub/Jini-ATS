<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jini-ATS 2.0 · 스마트 인사채용 관리 시스템</title>
  
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
<style>
:root{
  --bg:#f4f6fa;
  --panel:#fff;
  --text:#172033;
  --muted:#6d7587;
  --line:#e6e9ef;
  --primary:#4f46e5;
  --primary2:#6366f1;
  --green:#16a34a;
  --amber:#d97706;
  --red:#dc2626;
  --shadow:0 10px 30px rgba(24,32,56,.07);
  --radius:18px
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;
  background:var(--bg);
  color:var(--text)
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  display:flex;
  min-height:100vh
}

.sidebar{
  width:250px;
  background:#111827;
  color:#fff;
  padding:22px 16px;
  position:sticky;
  top:0;
  height:100vh
}

.brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.5px;
  padding:10px 12px 22px
}

.brand span{color:#a5b4fc}

.nav{
  display:grid;
  gap:7px
}

.nav button{
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:12px 14px;
  border-radius:11px
}

.nav button.active,
.nav button:hover{
  background:#1f2937;
  color:#fff
}

.side-foot{
  position:absolute;
  bottom:18px;
  left:18px;
  right:18px;
  color:#9ca3af;
  font-size:12px;
  line-height:1.6
}

.main{
  flex:1;
  min-width:0
}

.topbar{
  min-height:70px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:10px 28px;
  position:sticky;
  top:0;
  z-index:10
}

.top-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0
}

.topbar h1{
  font-size:20px;
  margin:0;
  white-space:nowrap
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:nowrap;
  justify-content:flex-end
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 14px;
  border-radius:10px;
  font-weight:700
}

.btn:hover{
  background:#f8fafc
}

.btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}

.btn.primary:hover{
  background:#4338ca
}

.btn.ghost{
  background:#f7f8ff;
  color:var(--primary);
  border-color:#dde0ff
}

.home-btn{
  background:#f7f8ff;
  color:var(--primary);
  border-color:#dde0ff
}

.save-status{
  color:#15803d;
  font-size:11px;
  font-weight:700;
  white-space:nowrap
}

.page{
  padding:26px 28px 48px;
  max-width:1500px;
  margin:auto
}

.grid{
  display:grid;
  gap:18px
}

.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px
}

.stat{
  display:flex;
  justify-content:space-between;
  align-items:flex-start
}

.stat .num{
  font-size:30px;
  font-weight:800;
  margin-top:6px
}

.muted{color:var(--muted)}

.eyebrow{
  font-size:12px;
  color:var(--muted);
  font-weight:700
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}

.title-row h2{
  font-size:18px;
  margin:0
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800
}

.b-blue{background:#eef2ff;color:#4338ca}
.b-green{background:#ecfdf3;color:#15803d}
.b-amber{background:#fff7ed;color:#c2410c}
.b-red{background:#fef2f2;color:#b91c1c}
.b-gray{background:#f3f4f6;color:#4b5563}

.bar{
  height:8px;
  background:#eef0f4;
  border-radius:10px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--primary),#8b5cf6);
  border-radius:10px
}

.kpi-list{
  display:grid;
  gap:13px
}

.kpi-line{
  display:grid;
  grid-template-columns:130px 1fr 60px;
  gap:12px;
  align-items:center;
  font-size:13px
}

.table{
  width:100%;
  border-collapse:separate;
  border-spacing:0
}

.table th,
.table td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  text-align:left
}

.table th{
  color:var(--muted);
  font-size:12px;
  background:#fafbfc
}

.table tr:last-child td{
  border-bottom:0
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#eef2ff;
  color:#4338ca;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800
}

.person{
  display:flex;
  align-items:center;
  gap:10px
}

.score{
  font-size:22px;
  font-weight:900
}

.score.good{color:var(--green)}
.score.mid{color:var(--amber)}
.score.low{color:var(--red)}

.stage-summary{
  display:flex;
  gap:10px;
  margin:0 0 14px;
  flex-wrap:wrap
}

.stage-summary>div{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 12px;
  font-size:12px
}

.stage-summary b{
  margin-left:4px
}

.stage-summary .reject-summary{
  color:#b91c1c;
  border-color:#fecaca;
  background:#fff7f7
}

.board{
  display:grid;
  grid-template-columns:repeat(6,minmax(220px,1fr));
  gap:12px;
  align-items:start;
  overflow-x:auto;
  padding-bottom:4px
}

.column{
  background:#eef1f6;
  border-radius:15px;
  padding:10px;
  min-height:420px
}

.reject-column{
  background:#fff1f1;
  border:1px solid #fecaca
}

.column-head{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  font-size:13px;
  padding:5px 4px 10px
}

.candidate{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  margin-bottom:9px;
  box-shadow:0 5px 14px rgba(0,0,0,.04);
  transition:.15s
}

.candidate:hover{
  transform:translateY(-1px)
}

.candidate.dragging{
  opacity:.45;
  transform:rotate(1deg)
}

.column.drag-over{
  outline:2px dashed var(--primary);
  background:#eef2ff
}

.dropzone{
  border:2px dashed #cfd4e1;
  border-radius:14px;
  padding:18px;
  text-align:center;
  background:#fafbff;
  color:var(--muted);
  cursor:pointer
}

.dropzone:hover{
  border-color:#a5b4fc;
  background:#f7f8ff
}

.file-pill{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:9px 11px;
  background:#f7f8ff;
  border-radius:10px;
  font-size:12px;
  margin-top:8px
}

.ai-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted)
}

.cand-top{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.cand-name{
  font-weight:800
}

.cand-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px
}

.chip{
  font-size:10px;
  border:1px solid #e5e7eb;
  padding:4px 6px;
  border-radius:6px;
  background:#fafafa
}

.cand-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:12px
}

.link-btn{
  border:0;
  background:transparent;
  color:var(--primary);
  font-weight:800;
  font-size:12px;
  padding:0
}

.field{
  display:grid;
  gap:7px;
  margin-bottom:13px
}

.field label{
  font-size:12px;
  font-weight:800;
  color:#475569
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  background:#fff;
  outline:0
}

.field textarea{
  min-height:150px;
  resize:vertical
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#a5b4fc;
  box-shadow:0 0 0 3px #eef2ff
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap
}

.empty{
  padding:55px 15px;
  text-align:center;
  color:var(--muted)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:30
}

.modal.open{
  display:flex
}

.modal-box{
  background:#fff;
  max-width:920px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:24px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px
}

.close{
  border:0;
  background:#f3f4f6;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:18px;
  flex:none
}

.analysis-grid{
  display:grid;
  grid-template-columns:250px 1fr;
  gap:18px
}

.score-ring{
  border-radius:50%;
  width:170px;
  height:170px;
  background:conic-gradient(
    var(--primary) calc(var(--score)*1%),
    #eceff3 0
  );
  display:grid;
  place-items:center;
  margin:5px auto 15px;
  position:relative
}

.score-ring:after{
  content:'';
  width:128px;
  height:128px;
  border-radius:50%;
  background:#fff;
  position:absolute
}

.ring-inner{
  position:relative;
  z-index:2;
  font-size:34px;
  font-weight:900
}

.keyword-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.keyword{
  padding:7px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:700
}

.kw-hit{
  background:#ecfdf3;
  color:#15803d
}

.kw-miss{
  background:#fef2f2;
  color:#b91c1c
}

.notice{
  padding:12px;
  border-radius:11px;
  background:#f7f8ff;
  color:#4f46e5;
  font-size:12px;
  line-height:1.6
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:18px
}

.tabs button{
  border:0;
  background:#eef0f6;
  padding:9px 12px;
  border-radius:9px;
  font-size:12px;
  font-weight:800
}

.tabs button.active{
  background:#1f2937;
  color:#fff
}

.searchrow{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px
}

.searchrow input,
.searchrow select{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  background:#fff
}

.right{
  margin-left:auto
}

.mini{
  font-size:11px
}

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#111827;
  color:#fff;
  padding:12px 15px;
  border-radius:10px;
  opacity:0;
  transform:translateY(10px);
  transition:.2s;
  z-index:40;
  font-size:13px
}

.toast.show{
  opacity:1;
  transform:translateY(0)
}

.version{
  font-size:10px;
  color:#64748b;
  margin-top:8px
}

.data-info{
  margin-top:10px;
  padding:10px 12px;
  border-radius:10px;
  background:#f8fafc;
  border:1px solid var(--line);
  font-size:11px;
  color:var(--muted)
}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,minmax(220px,1fr))}
  .analysis-grid{grid-template-columns:1fr}
  .sidebar{width:210px}
}

@media(max-width:720px){

  .sidebar{
    display:none
  }

  .mobile-menu-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:#fff;
    font-size:22px;
    font-weight:800;
    flex:none;
  }

  .mobile-menu{
    display:none;
    position:fixed;
    top:70px;
    left:10px;
    right:10px;
    background:#111827;
    border-radius:14px;
    padding:10px;
    z-index:100;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }

  .mobile-menu.open{
    display:grid;
    gap:5px;
  }

  .mobile-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#cbd5e1;
    text-align:left;
    padding:14px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
  }

  .mobile-menu button.active,
  .mobile-menu button:active{
    background:#1f2937;
    color:#fff;
  }

  .topbar{
    padding:10px 14px;
    align-items:flex-start
  }

  .top-left{
    align-items:center
  }

  .topbar h1{
    font-size:17px
  }

  .top-actions{
    gap:6px
  }

  .top-actions .seed-btn{
    display:none
  }

  .save-status{
    display:none
  }

  .home-btn{
    padding:9px 10px
  }

  .page{
    padding:18px
  }

  .g4,
  .g3,
  .g2{
    grid-template-columns:1fr
  }

  .board{
    grid-template-columns:1fr
  }

  .kpi-line{
    grid-template-columns:105px 1fr 50px
  }

  .modal{
    padding:10px
  }

  .modal-box{
    padding:18px;
    max-height:94vh
  }

  .title-row{
    align-items:flex-start;
    flex-direction:column
  }

  .title-row>button,
  .title-row>div+button{
    align-self:flex-end
  }
}

  .topbar{
    padding:10px 14px;
    align-items:flex-start
  }

  .top-left{
    align-items:center
  }

  .topbar h1{
    font-size:17px
  }

  .top-actions{
    gap:6px
  }

  .top-actions .seed-btn{
    display:none
  }

  .save-status{
    display:none
  }

  .home-btn{
    padding:9px 10px
  }

  .page{
    padding:18px
  }

  .g4,
  .g3,
  .g2{
    grid-template-columns:1fr
  }

  .board{
    grid-template-columns:1fr
  }

  .kpi-line{
    grid-template-columns:105px 1fr 50px
  }

  .modal{
    padding:10px
  }

  .modal-box{
    padding:18px;
    max-height:94vh
  }

  .title-row{
    align-items:flex-start;
    flex-direction:column
  }

  .title-row>button,
  .title-row>div+button{
    align-self:flex-end
  }
}
</style>

<style>
/* =========================================================
   Jini-ATS 2.0
   iOS / Apple Style Design
   STEP 4 - Global + Sidebar + Header
   기능 및 기존 JavaScript는 변경하지 않음
   ========================================================= */


/* =========================================================
   1. Design Tokens
   ========================================================= */

:root{
  --bg:#F2F2F7;
  --panel:#FFFFFF;

  --text:#1C1C1E;
  --text2:#3A3A3C;
  --muted:#6E6E73;
  --muted2:#8E8E93;

  --line:#E5E5EA;
  --line2:#D1D1D6;

  --primary:#007AFF;
  --primary-dark:#005FCC;
  --primary-soft:#EAF3FF;

  --indigo:#5856D6;
  --green:#34C759;
  --green-soft:#EAF9EE;

  --amber:#FF9500;
  --amber-soft:#FFF4E5;

  --red:#FF3B30;
  --red-soft:#FFF0F0;

  --gray-soft:#F2F2F7;

  --radius:20px;
  --radius-sm:14px;

  --shadow:
    0 4px 20px rgba(0,0,0,.045),
    0 2px 6px rgba(0,0,0,.025);

  --shadow-hover:
    0 10px 30px rgba(0,0,0,.07);
}


/* =========================================================
   2. 기본
   ========================================================= */

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;

  font-family:
    "Pretendard Variable",
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;

  background:var(--bg);
  color:var(--text);

  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;

  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   3. 스크롤바
   ========================================================= */

::-webkit-scrollbar{
  width:6px;
  height:6px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:#D1D1D6;
  border-radius:999px;
}

::-webkit-scrollbar-thumb:hover{
  background:#B8B8BE;
}


/* =========================================================
   4. 전체 앱
   ========================================================= */

.app{
  min-height:100vh;
  background:var(--bg);
}


/* =========================================================
   5. PC Sidebar
   ========================================================= */

.sidebar{
  width:250px;

  background:rgba(255,255,255,.90);

  color:var(--text);

  border-right:1px solid rgba(229,229,234,.9);

  padding:22px 14px;

  box-shadow:
    4px 0 24px rgba(0,0,0,.025);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  z-index:20;

  transition:
    width .2s ease,
    box-shadow .2s ease;
}


/* =========================================================
   6. Brand
   ========================================================= */

.brand{
  padding:8px 12px 26px;

  font-size:21px;
  font-weight:800;

  letter-spacing:-.7px;

  color:var(--text);
}

.brand span{
  color:var(--primary);
}

.brand .version{
  margin-top:6px;

  font-size:11px;
  font-weight:600;

  color:var(--muted2);

  letter-spacing:0;
}


/* =========================================================
   7. PC Navigation
   ========================================================= */

.nav{
  display:grid;
  gap:6px;
}

.nav button{
  position:relative;

  width:100%;

  border:0;
  outline:0;

  background:transparent;

  color:#636366;

  text-align:left;

  padding:13px 14px;

  border-radius:14px;

  font-family:inherit;

  font-size:14px;
  font-weight:650;

  cursor:pointer;

  transition:
    background .18s ease,
    color .18s ease,
    transform .12s ease;
}

.nav button:hover{
  background:#F2F2F7;
  color:var(--text);
}

.nav button:active{
  transform:scale(.985);
}

.nav button.active{
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:750;
}

.nav button.active::before{
  content:"";

  position:absolute;

  left:0;
  top:50%;

  width:3px;
  height:22px;

  transform:translateY(-50%);

  border-radius:999px;

  background:var(--primary);
}


/* =========================================================
   8. Sidebar Bottom
   ========================================================= */

.side-foot{
  color:var(--muted2);

  font-size:11px;

  line-height:1.6;

  padding:10px 12px;
}


/* =========================================================
   9. Main
   ========================================================= */

.main{
  min-width:0;

  background:var(--bg);
}


/* =========================================================
   10. Header / Topbar
   ========================================================= */

.topbar{
  min-height:74px;

  background:rgba(255,255,255,.88);

  border-bottom:1px solid rgba(229,229,234,.85);

  padding:12px 28px;

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    0 1px 12px rgba(0,0,0,.025);

  z-index:50;
}

.top-left{
  display:flex;

  align-items:center;

  gap:12px;
}

.topbar h1{
  margin:0;

  font-size:20px;
  font-weight:750;

  letter-spacing:-.55px;

  color:var(--text);
}


/* =========================================================
   11. Top Actions
   ========================================================= */

.top-actions{
  display:flex;

  align-items:center;

  gap:8px;
}


/* =========================================================
   12. Button
   ========================================================= */

.btn{
  border:1px solid var(--line);

  background:#fff;

  color:var(--text);

  padding:10px 15px;

  border-radius:13px;

  font-family:inherit;

  font-size:13px;
  font-weight:700;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .15s ease,
    border-color .15s ease,
    box-shadow .15s ease;
}

.btn:hover{
  background:#F8F8FA;

  border-color:#D1D1D6;
}

.btn:active{
  transform:scale(.98);
}

.btn.primary{
  background:var(--primary);

  border-color:var(--primary);

  color:#fff;

  box-shadow:
    0 4px 12px rgba(0,122,255,.18);
}

.btn.primary:hover{
  background:var(--primary-dark);

  border-color:var(--primary-dark);
}

.btn.ghost,
.home-btn{
  background:#F2F7FF;

  color:var(--primary);

  border-color:#DCEBFF;
}

.btn.ghost:hover,
.home-btn:hover{
  background:#EAF3FF;
}


/* =========================================================
   13. Page
   ========================================================= */

.page{
  width:100%;

  max-width:1400px;

  margin:0 auto;

  padding:28px 30px 50px;
}


/* =========================================================
   14. Card
   ========================================================= */

.card{
  background:var(--panel);

  border:1px solid rgba(229,229,234,.85);

  border-radius:20px;

  box-shadow:var(--shadow);

  padding:20px;

  transition:
    box-shadow .18s ease,
    transform .18s ease,
    border-color .18s ease;
}

.card:hover{
  border-color:#DEDEE3;
}

.card-interactive{
  cursor:pointer;
}

.card-interactive:hover{
  box-shadow:var(--shadow-hover);
}

.card-interactive:active{
  transform:scale(.985);
}


/* =========================================================
   15. Title
   ========================================================= */

.title-row{
  margin-bottom:18px;
}

.title-row h2{
  margin:0;

  font-size:19px;

  font-weight:750;

  letter-spacing:-.45px;

  color:var(--text);
}


/* =========================================================
   16. Text
   ========================================================= */

.muted{
  color:var(--muted);
}

.eyebrow{
  color:var(--muted2);

  font-size:11px;

  font-weight:700;

  letter-spacing:.1px;
}


/* =========================================================
   17. KPI / Statistics
   ========================================================= */

.stat .num{
  font-size:30px;

  font-weight:800;

  letter-spacing:-1px;

  color:var(--text);
}


/* =========================================================
   18. Badge
   ========================================================= */

.badge{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:6px 10px;

  border-radius:999px;

  font-size:11px;

  font-weight:750;

  border:0;

  white-space:nowrap;
}

.b-blue{
  background:var(--primary-soft);
  color:var(--primary);
}

.b-green{
  background:var(--green-soft);
  color:#248A3D;
}

.b-amber{
  background:var(--amber-soft);
  color:#C93400;
}

.b-red{
  background:var(--red-soft);
  color:#D70015;
}

.b-gray{
  background:var(--gray-soft);
  color:#636366;
}


/* =========================================================
   19. Progress
   ========================================================= */

.bar{
  height:8px;

  background:#E5E5EA;

  border-radius:999px;

  overflow:hidden;
}

.bar i{
  display:block;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #007AFF,
      #5856D6
    );

  border-radius:999px;
}


/* =========================================================
   20. Avatar
   ========================================================= */

.avatar{
  width:40px;
  height:40px;

  min-width:40px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #EAF3FF,
      #EDEBFF
    );

  color:var(--primary);

  font-weight:800;
}


/* =========================================================
   21. Person
   ========================================================= */

.person{
  display:flex;

  align-items:center;

  gap:11px;

  min-width:0;
}


/* =========================================================
   22. Table
   ========================================================= */

.table{
  width:100%;

  border-collapse:separate;

  border-spacing:0;

  overflow:hidden;

  border:1px solid var(--line);

  border-radius:16px;

  background:#fff;
}

.table th{
  background:#F8F8FA;

  color:var(--muted);

  font-size:11px;

  font-weight:700;

  border-bottom:1px solid var(--line);
}

.table td{
  background:#fff;

  border-bottom:1px solid #F0F0F2;
}

.table tr:last-child td{
  border-bottom:0;
}

.table tbody tr{
  transition:background .15s ease;
}

.table tbody tr:hover td{
  background:#FAFAFC;
}


/* =========================================================
   23. Form
   ========================================================= */

.field{
  gap:7px;
}

.field label{
  color:var(--text2);

  font-size:12px;

  font-weight:700;
}

.field input,
.field textarea,
.field select{
  width:100%;

  border:1px solid var(--line2);

  border-radius:13px;

  padding:12px 13px;

  background:#F8F8FA;

  color:var(--text);

  font-family:inherit;

  outline:none;

  transition:
    border-color .15s ease,
    box-shadow .15s ease,
    background .15s ease;
}

.field input::placeholder,
.field textarea::placeholder{
  color:#AEAEB2;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  background:#fff;

  border-color:#80BFFF;

  box-shadow:
    0 0 0 4px rgba(0,122,255,.10);
}


/* =========================================================
   24. Search
   ========================================================= */

.searchrow input,
.searchrow select{
  border:1px solid var(--line2);

  border-radius:13px;

  background:#fff;

  padding:11px 13px;

  font-family:inherit;

  outline:none;
}

.searchrow input:focus,
.searchrow select:focus{
  border-color:#80BFFF;

  box-shadow:
    0 0 0 4px rgba(0,122,255,.08);
}


/* =========================================================
   25. Candidate
   ========================================================= */

.candidate{
  background:#fff;

  border:1px solid var(--line);

  border-radius:18px;

  padding:15px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.035);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.candidate:hover{
  transform:translateY(-1px);

  border-color:#D9D9DE;

  box-shadow:
    0 7px 20px rgba(0,0,0,.06);
}

.cand-name{
  font-weight:750;

  color:var(--text);
}


/* =========================================================
   26. Chip
   ========================================================= */

.chip{
  border:0;

  background:var(--gray-soft);

  color:#636366;

  padding:5px 8px;

  border-radius:999px;

  font-size:10px;

  font-weight:650;
}


/* =========================================================
   27. Dropzone
   ========================================================= */

.dropzone{
  border:2px dashed var(--line2);

  border-radius:18px;

  padding:24px;

  background:#FAFAFC;

  color:var(--muted2);

  transition:
    border-color .18s ease,
    background .18s ease;
}

.dropzone:hover{
  border-color:#80BFFF;

  background:#F5F9FF;
}


/* =========================================================
   28. Modal
   ========================================================= */

.modal{
  background:rgba(0,0,0,.35);

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.modal-box{
  background:#fff;

  border-radius:24px;

  padding:24px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.18);

  border:1px solid rgba(255,255,255,.8);
}

.close{
  width:36px;
  height:36px;

  border:0;

  background:#F2F2F7;

  color:#636366;

  border-radius:50%;

  cursor:pointer;

  transition:
    background .15s ease,
    transform .15s ease;
}

.close:hover{
  background:#E5E5EA;
}

.close:active{
  transform:scale(.94);
}


/* =========================================================
   29. ATS Score
   ========================================================= */

.score{
  font-weight:850;
}

.score.good{
  color:#248A3D;
}

.score.mid{
  color:#C93400;
}

.score.low{
  color:#D70015;
}

.score-ring{
  box-shadow:
    0 8px 24px rgba(0,122,255,.12);
}


/* =========================================================
   30. ATS Notice
   ========================================================= */

.notice{
  border-radius:15px;

  background:#F2F7FF;

  color:#0066CC;

  border:1px solid #DCEBFF;
}


/* =========================================================
   31. Keyword
   ========================================================= */

.keyword{
  border-radius:999px;

  padding:7px 10px;
}

.kw-hit{
  background:var(--green-soft);

  color:#248A3D;
}

.kw-miss{
  background:var(--red-soft);

  color:#D70015;
}


/* =========================================================
   32. Tabs
   ========================================================= */

.tabs button{
  border:0;

  background:#E5E5EA;

  color:#636366;

  border-radius:999px;

  padding:9px 13px;

  font-family:inherit;

  font-weight:700;

  cursor:pointer;

  transition:
    background .15s ease,
    color .15s ease;
}

.tabs button:hover{
  background:#DCDCE1;
}

.tabs button.active{
  background:var(--primary);

  color:#fff;
}


/* =========================================================
   33. Mobile Menu Button
   ========================================================= */

.mobile-menu-btn{
  width:40px;
  height:40px;

  border:0;

  border-radius:12px;

  background:var(--primary);

  color:#fff;

  font-size:20px;

  cursor:pointer;

  box-shadow:
    0 4px 12px rgba(0,122,255,.18);

  transition:
    transform .15s ease,
    background .15s ease;
}

.mobile-menu-btn:hover{
  background:var(--primary-dark);
}

.mobile-menu-btn:active{
  transform:scale(.94);
}


/* =========================================================
   34. Mobile Menu
   ========================================================= */

.mobile-menu{
  background:rgba(255,255,255,.95);

  border:1px solid rgba(229,229,234,.9);

  border-radius:20px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.12);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  padding:10px;
}

.mobile-menu button{
  color:#3A3A3C;

  border:0;

  border-radius:14px;

  padding:13px;

  font-family:inherit;

  font-weight:700;

  background:transparent;

  transition:
    background .15s ease,
    color .15s ease;
}

.mobile-menu button:hover{
  background:#F2F2F7;
}

.mobile-menu button.active,
.mobile-menu button:active{
  background:var(--primary-soft);

  color:var(--primary);
}


/* =========================================================
   35. Toast
   ========================================================= */

.toast{
  background:#1C1C1E;

  color:#fff;

  border-radius:14px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.18);
}


/* =========================================================
   36. Data Info
   ========================================================= */

.data-info{
  background:#F8F8FA;

  border:1px solid var(--line);

  border-radius:14px;
}


/* =========================================================
   37. 링크
   ========================================================= */

a{
  color:var(--primary);
}

a:hover{
  color:var(--primary-dark);
}


/* =========================================================
   38. Selection
   ========================================================= */

::selection{
  background:rgba(0,122,255,.18);
}


/* =========================================================
   39. Mobile
   ========================================================= */

@media(max-width:720px){

  body{
    background:var(--bg);
  }

  .sidebar{
    width:100%;
  }

  .topbar{
    min-height:64px;

    padding:9px 13px;

    border-radius:0 0 18px 18px;
  }

  .topbar h1{
    font-size:17px;
  }

  .top-actions{
    gap:5px;
  }

  .page{
    padding:16px 14px 80px;
  }

  .card{
    border-radius:20px;

    padding:17px;
  }

  .title-row h2{
    font-size:18px;
  }

  .btn{
    border-radius:13px;

    padding:10px 13px;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    border-radius:24px;

    padding:18px;

    max-height:92vh;
  }

  .table{
    font-size:12px;
  }

  .table th,
  .table td{
    padding:10px 8px;
  }

}


/* =========================================================
   40. 아주 작은 모바일
   ========================================================= */

@media(max-width:420px){

  .page{
    padding-left:11px;
    padding-right:11px;
  }

  .top-actions .seed-btn{
    display:none;
  }

  .home-btn{
    padding:9px 10px;
  }

  .topbar h1{
    font-size:16px;
  }

}


/* =========================================================
   END - Jini-ATS 2.0 STEP 4
   ========================================================= */

  /* =========================================================
   Jini-ATS 2.0
   STEP 5 - Dashboard
   ========================================================= */

.dashboard-hero{
  position:relative;
  min-height:220px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:34px 38px;
  border-radius:26px;
  background:
    linear-gradient(
      135deg,
      #FFFFFF 0%,
      #F8FAFF 55%,
      #EEF5FF 100%
    );
  border:1px solid rgba(229,229,234,.9);
  box-shadow:
    0 8px 30px rgba(0,0,0,.045),
    0 2px 8px rgba(0,0,0,.025);
}

.dashboard-hero-text{
  position:relative;
  z-index:2;
}

.dashboard-eyebrow{
  margin-bottom:10px;
  color:#007AFF;
  font-size:12px;
  font-weight:800;
  letter-spacing:.2px;
}

.dashboard-hero h2{
  margin:0;
  color:#1C1C1E;
  font-size:31px;
  line-height:1.22;
  font-weight:800;
  letter-spacing:-1.1px;
}

.dashboard-hero p{
  margin:14px 0 0;
  color:#6E6E73;
  font-size:13px;
  line-height:1.7;
}

.dashboard-hero-mark{
  position:absolute;
  right:30px;
  top:50%;
  width:210px;
  height:210px;
  transform:translateY(-50%);
}

.dashboard-hero-orb{
  position:absolute;
  width:170px;
  height:170px;
  right:0;
  top:20px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.95) 0%,
      rgba(110,170,255,.55) 24%,
      rgba(88,86,214,.30) 58%,
      rgba(0,122,255,.05) 76%,
      transparent 78%
    );
  filter:blur(.2px);
}

.dashboard-hero-orb::after{
  content:"";
  position:absolute;
  width:85px;
  height:85px;
  right:40px;
  top:40px;
  border-radius:50%;
  background:rgba(255,255,255,.48);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}


.dashboard-kpi-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:14px;
}

.dashboard-kpi-card{
  min-width:0;
  padding:20px;
  border-radius:20px;
  background:#FFFFFF;
  border:1px solid rgba(229,229,234,.9);
  box-shadow:
    0 4px 18px rgba(0,0,0,.035),
    0 1px 4px rgba(0,0,0,.02);
  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.dashboard-kpi-card:hover{
  transform:translateY(-2px);
  box-shadow:
    0 10px 28px rgba(0,0,0,.065);
}

.dashboard-kpi-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.dashboard-kpi-icon{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  font-size:14px;
  font-weight:800;
}

.dashboard-kpi-icon.blue{
  background:#EAF3FF;
  color:#007AFF;
}

.dashboard-kpi-icon.indigo{
  background:#EEEDFF;
  color:#5856D6;
}

.dashboard-kpi-icon.green{
  background:#EAF9EE;
  color:#248A3D;
}

.dashboard-kpi-icon.orange{
  background:#FFF4E5;
  color:#C93400;
}

.dashboard-kpi-label{
  color:#6E6E73;
  font-size:12px;
  font-weight:700;
}

.dashboard-kpi-number{
  margin-top:4px;
  color:#1C1C1E;
  font-size:31px;
  line-height:1.1;
  font-weight:850;
  letter-spacing:-1px;
}

.dashboard-kpi-description{
  margin-top:8px;
  color:#8E8E93;
  font-size:11px;
}


.dashboard-main-grid{
  display:grid;
  grid-template-columns:
    minmax(0,1.08fr)
    minmax(0,.92fr);
  gap:14px;
}

.dashboard-panel{
  min-width:0;
  padding:21px;
  border-radius:20px;
  background:#FFFFFF;
  border:1px solid rgba(229,229,234,.9);
  box-shadow:
    0 4px 18px rgba(0,0,0,.035),
    0 1px 4px rgba(0,0,0,.02);
}

.dashboard-panel-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.dashboard-panel-title{
  color:#1C1C1E;
  font-size:16px;
  font-weight:800;
  letter-spacing:-.35px;
}

.dashboard-panel-subtitle{
  margin-top:4px;
  color:#8E8E93;
  font-size:11px;
}

.dashboard-panel-icon{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:#F2F2F7;
  color:#636366;
  font-size:14px;
  font-weight:800;
}

.dashboard-more-btn{
  border:0;
  background:transparent;
  color:#007AFF;
  padding:6px 0;
  font-family:inherit;
  font-size:12px;
  font-weight:750;
  cursor:pointer;
}

.dashboard-more-btn:hover{
  color:#005FCC;
}


.dashboard-funnel{
  display:grid;
  gap:17px;
}

.dashboard-funnel-row{
  display:grid;
  grid-template-columns:76px minmax(0,1fr) 42px;
  align-items:center;
  gap:10px;
}

.dashboard-funnel-label{
  display:flex;
  flex-direction:column;
  gap:3px;
  color:#636366;
  font-size:11px;
  font-weight:650;
}

.dashboard-funnel-label b{
  color:#1C1C1E;
  font-size:12px;
}

.dashboard-funnel-track{
  height:9px;
  overflow:hidden;
  border-radius:999px;
  background:#F2F2F7;
}

.dashboard-funnel-fill{
  height:100%;
  min-width:0;
  border-radius:999px;
  background:
    linear-gradient(
      90deg,
      #007AFF,
      #5856D6
    );
  transition:width .35s ease;
}

.dashboard-funnel-percent{
  color:#8E8E93;
  text-align:right;
  font-size:10px;
  font-weight:700;
}


.dashboard-candidate-list{
  display:grid;
}

.dashboard-candidate-row{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:12px 0;
  border-bottom:1px solid #F0F0F2;
}

.dashboard-candidate-row:first-child{
  padding-top:0;
}

.dashboard-candidate-row:last-child{
  padding-bottom:0;
  border-bottom:0;
}

.dashboard-candidate-avatar{
  width:38px;
  height:38px;
  min-width:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #EAF3FF,
      #EEEDFF
    );
  color:#007AFF;
  font-size:12px;
  font-weight:800;
}

.dashboard-candidate-info{
  min-width:0;
  flex:1;
}

.dashboard-candidate-name{
  overflow:hidden;
  color:#1C1C1E;
  font-size:12px;
  font-weight:750;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dashboard-candidate-meta{
  margin-top:3px;
  overflow:hidden;
  color:#8E8E93;
  font-size:10px;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dashboard-candidate-score{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  min-width:36px;
}

.dashboard-candidate-score strong{
  font-size:15px;
  font-weight:850;
}

.dashboard-candidate-score strong.good{
  color:#248A3D;
}

.dashboard-candidate-score strong.mid{
  color:#C93400;
}

.dashboard-candidate-score strong.low{
  color:#D70015;
}

.dashboard-candidate-score span{
  margin-top:1px;
  color:#AEAEB2;
  font-size:9px;
}


.dashboard-job-list{
  display:grid;
}

.dashboard-job-row{
  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    90px
    90px;
  align-items:center;
  gap:20px;
  padding:16px 4px;
  border-top:1px solid #F0F0F2;
}

.dashboard-job-row:first-child{
  border-top:0;
}

.dashboard-job-main{
  min-width:0;
}

.dashboard-job-status{
  display:inline-flex;
  margin-bottom:5px;
  padding:4px 8px;
  border-radius:999px;
  background:#EAF9EE;

.candidate-stage-dot.stage-3{

.candidate-stage-dot.stage-4{

.candidate-stage-count{

  font-size:10px;

.candidate-column-body{

/* =========================================================

/* =========================================================

   ========================================================= */

.candidate-person{

.candidate-avatar{

.candidate-name-new{

.candidate-job-new{

.candidate-score-new{

.candidate-score-new.good{

.candidate-score-new.mid{

  background:#FFF6DF;

}


.candidate-score-new.low{

}


.candidate-meta-new{

.candidate-career-company{

}

.candidate-chips-new{

.candidate-chips-new span{

.candidate-card-bottom{

/* =========================================================

.candidate-save-info{

/* =========================================================

   ========================================================= */

@media(max-width:1200px){

  .candidate-summary-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

  .candidate-board{

    grid-template-columns:
      repeat(6,205px);

  }

}


@media(max-width:720px){

  .candidates-hero{

    flex-direction:column;

    align-items:flex-start;

    padding:24px;

  }


  .candidates-hero-actions{

    width:100%;
  }

    flex:1;

  .candidate-summary-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

  }


  .candidate-filter-card{

    flex-direction:column;

    align-items:stretch;

  }


  .candidate-filter-left{

    width:100%;

    flex-direction:column;

    align-items:stretch;

  }


  .candidate-search-box{

    max-width:none;
  }


  .candidate-job-filter{

    width:100%;
  }


  .candidate-filter-info{

    justify-content:flex-end;
  }


  .candidate-board-section{

    padding:14px;
  }


  .candidate-board-header{

    align-items:flex-start;

    flex-direction:column;

  }


  .candidate-board-help{

    font-size:9px;
  }

}


@media(max-width:420px){

  .candidates-hero{

    padding:20px;

    border-radius:20px;
  }


  .candidates-hero h2{

    font-size:21px;
  }


  .candidates-hero-actions{

    flex-direction:column;
  }


  .candidate-summary-card{

    min-height:92px;

    padding:13px;

    gap:9px;

  .candidate-summary-icon{

  }


  .candidate-board{

  }


  .candidate-column{

    min-width:190px;
  }

}

.analysis-detail-actions{

/* 점수 */

.analysis-score-layout{
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  gap:28px;
  padding:28px 0;
  border-bottom:1px solid #edf0f3;
}

.analysis-score-panel{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.analysis-score-ring{
  width:178px;
  height:178px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:
    conic-gradient(
      #6366f1 0deg,
      #6366f1 calc(var(--analysis-score, 0) * 3.6deg),
      #eceef2 calc(var(--analysis-score, 0) * 3.6deg),
      #eceef2 360deg
    );
}

.analysis-score-ring.good{
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e calc(var(--analysis-score, 0) * 3.6deg),
      #e8f5ed calc(var(--analysis-score, 0) * 3.6deg),
      #e8f5ed 360deg
    );
}

.analysis-score-ring.mid{
  background:
    conic-gradient(
      #f59e0b 0deg,
      #f59e0b calc(var(--analysis-score, 0) * 3.6deg),
      #fff2d7 calc(var(--analysis-score, 0) * 3.6deg),
      #fff2d7 360deg
    );
}

.analysis-score-ring.low{
  background:
    conic-gradient(
      #ef4444 0deg,
      #ef4444 calc(var(--analysis-score, 0) * 3.6deg),
      #feeaea calc(var(--analysis-score, 0) * 3.6deg),
      #feeaea 360deg
    );
}

.analysis-score-ring::before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  background:#ffffff;
}

.analysis-score-ring > div{
  position:relative;
  z-index:1;
  text-align:center;
}

.analysis-score-ring strong{
  display:block;
  font-size:46px;
  line-height:1;
  letter-spacing:-.05em;
}

.analysis-score-ring span{
  color:#9ca3af;
  font-size:11px;
}

.analysis-score-label{
  margin-top:14px;
  color:#6b7280;
  font-size:12px;
}

.analysis-score-status{
  margin-top:8px;

  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.analysis-score-status.good{
  color:#15803d;
  background:#eafaf2;
}

.analysis-score-status.mid{
  color:#b45309;
  background:#fff6df;
}

.analysis-score-status.low{

/* 지표 */

.analysis-metric-grid{

}

.analysis-metric-top span{

}

.analysis-progress{

}


/* 정보 카드 */

.analysis-chip-wrap{

}

.analysis-keyword-chip.miss{

}

.analysis-keyword-title{

}

.analysis-keyword-title.miss{

}


/* 결론 */

.analysis-conclusion{

  align-items:flex-start;
  gap:14px;
  margin-top:14px;
  padding:20px;
  border-radius:19px;

.analysis-conclusion.good{

}

.analysis-conclusion.mid{

}

.analysis-conclusion.low{

}

.analysis-conclusion-icon{

}

.analysis-conclusion-label{
  margin-bottom:4px;
  font-size:10px;

}

.analysis-conclusion strong{
  display:block;
  font-size:14px;
  line-height:1.5;
}

.analysis-conclusion p{
  margin:5px 0 0;
  color:#858b94;
  font-size:11px;
  line-height:1.5;
}


/* 저장 안내 */

.analysis-save-info{

  align-items:flex-start;
  gap:10px;
}

.analysis-save-icon{
  width:25px;
  height:25px;

  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:#eafaf2;
  color:#16a34a;
  font-size:12px;
  font-weight:800;

function normalizeState(saved){

    ? saved

  return {

    ...base,

    ...s,

    jobs:Array.isArray(s.jobs)

      ? s.candidates

    ].includes(s.page)
      ? s.page
      : 'dashboard',

    jobFilter:

    query:
      typeof s.query === 'string'
        ? s.query
        : '',

aiKey:
  typeof s.aiKey === 'string'
    ? s.aiKey
    : GEMINI_API_KEY,

settingsSection:
  typeof s.settingsSection === 'string'
    ? s.settingsSection
    : 'main',

version:APP_VERSION

  };

}

function esc(s){

  return String(s ?? '')
    .replace(
      /[&<>'"]/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c])
    );

}


/* ============================================================
   PDF.js
   ============================================================ */

function initPdf(){

  return pdfModulePromise ||
    (
      pdfModulePromise =
        import(
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs'
        )
        .then(m=>{

          m.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

          return m;

        })
    );

}


async function extractPdfText(file){

  const pdfjs =
    await initPdf();

  const ab =
    await file.arrayBuffer();

  const pdf =
    await pdfjs.getDocument({
      data:ab
    }).promise;

  let out = [];

  for(
    let i=1;
    i<=pdf.numPages;
    i++
  ){

    const page =
      await pdf.getPage(i);

    const c =
      await page.getTextContent();

    out.push(
      c.items
        .map(x=>x.str)
        .join(' ')
    );

  }

  return out.join('\n');

}


/* ============================================================
   PDF 기본 정보 추출
   ============================================================ */

function estimateResumeFields(text){

  const t =
    text.replace(/\s+/g,' ');

  const email =
    (
      t.match(
        /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
      ) || []
    )[0] || '';

  const phone =
    (
      t.match(
        /(?:01[016789]|02|0[3-9][0-9])[- .]?\d{3,4}[- .]?\d{4}/
      ) || []
    )[0] || '';

  const yearsMatch =
    t.match(
      /(?:경력|경력사항)[^0-9]{0,15}(\d{1,2})\s*년/
    );

  const years =
    yearsMatch
      ? +yearsMatch[1]
      : 0;

  return {
    email,
    phone,
    years
  };

}


/* ============================================================
   Gemini
   ============================================================ */

function cleanAiText(x){

  return String(x || '')
    .trim()
    .replace(/^```(?:json)?/,'')
    .replace(/```$/,'')
    .trim();

}


async function fileToBase64(file){

  const ab =
    await file.arrayBuffer();

  let binary = '';

  const bytes =
    new Uint8Array(ab);

  const chunk =
    0x8000;

  for(
    let i=0;
    i<bytes.length;
    i+=chunk
  ){

    binary +=
      String.fromCharCode(
        ...bytes.subarray(
          i,
          Math.min(
            i+chunk,
            bytes.length
          )
        )
      );

  }

  return btoa(binary);

}


function getGeminiApiKey(){

  const direct =
    String(
      GEMINI_API_KEY || ''
    ).trim();

  const saved =
    String(
      state.aiKey || ''
    ).trim();

  const placeholder =
    '여기에_GEMINI_API_KEY_붙여넣기';

  if(
    direct &&
    direct !== placeholder
  ){

    return direct;

  }

  if(
    saved &&
    saved !== placeholder
  ){

    return saved;

  }

  return '';

}


async function analyzeResumeWithGemini(
  text,
  jd,
  file
){

  const apiKey =
    getGeminiApiKey();

  if(!apiKey)
    return null;

  const prompt = `
당신은 대한민국 기업의 전문 HR 채용담당자다.

아래 이력서/경력기술서를 실제 채용 검토용 데이터로 구조화하라.

중요 규칙:
1. 이력서에 명시된 사실만 사용한다.
2. 없는 정보는 추측하지 않는다.
3. 이름, 이메일, 전화번호는 문서에 있는 값을 그대로 사용한다.
4. 총 경력은 문서에 기재된 근무기간을 기준으로 계산한다.
5. 지원공고는 사용자가 직접 선택하므로 반환하지 않는다.
6. 모든 결과는 반드시 JSON 객체 하나로 반환한다.
7. JSON 이외의 설명은 절대 작성하지 않는다.

반드시 아래 JSON 구조를 사용한다.

{
  "name": "",
  "email": "",
  "phone": "",
  "years": 0,
  "education": "",
  "skills": [],
  "careerSummary": "",
  "keyCareers": [
    {
      "company": "",
      "position": "",
      "period": "",
      "description": ""
    }
  ],
  "concerns": []
}

각 필드 설명:

name:
지원자 이름

email:
이메일 주소

phone:
휴대전화 번호

years:
총 경력연수.
숫자만 반환한다.
예: 7년 3개월이면 7

education:
최종학력 중심으로 작성한다.
예:
"중앙대학교 MBA"
"서울대학교 경영학과"

skills:
이력서에 실제로 등장하는 핵심 업무/기술/전문분야를 배열로 작성한다.
최대 10개.

careerSummary:
지원자 전체를 한눈에 이해할 수 있도록 2~4문장으로 작성한다.

keyCareers:
주요 경력을 회사별로 정리한다.

각 경력:
company = 회사명
position = 직무/직책
period = 근무기간
description = 핵심 업무와 성과를 1~3문장으로 정리

최대 6개까지만 작성한다.

concerns:
이력서에서 실제로 확인되는 주의사항만 작성한다.
없으면 [].

지원 JD:
${jd || '별도 JD 없음'}

PDF 텍스트:
${text || '(PDF 텍스트 추출 실패)'}

`;

  const parts = [
    {
      text: prompt
    }
  ];

  if(file){

    const data =
      await fileToBase64(file);

    parts.push({
      inlineData:{
        mimeType:'application/pdf',
        data:data
      }
    });

  }

  const r =
    await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/' +
      GEMINI_MODEL +
      ':generateContent',
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json',
          'x-goog-api-key':apiKey
        },

        body:JSON.stringify({

          contents:[
            {
              parts:parts
            }
          ],

          generationConfig:{
            responseMimeType:'application/json'
          }

        })
      }
    );

  const raw =
    await r.text();

  let data;

  try{

    data =
      JSON.parse(raw);

  }catch{

    throw new Error(
      'Gemini 응답을 읽을 수 없습니다.'
    );

  }

  if(!r.ok){

    const msg =
      data?.error?.message ||
      ('AI API 오류 ' + r.status);

    throw new Error(msg);

  }

  const out =
    (data.candidates || [])
      .flatMap(
        c=>c.content?.parts || []
      )
      .map(
        p=>p.text || ''
      )
      .join('');

  if(!out){

    throw new Error(
      'Gemini가 분석 결과를 반환하지 않았습니다.'
    );

  }

  const result =
    JSON.parse(
      cleanAiText(out)
    );

  return result;

}

/* ============================================================
   Drag & Drop
   ============================================================ */

function dragStartCandidate(e,id){

  e.stopPropagation();

  e.dataTransfer.effectAllowed =
    'move';

  e.dataTransfer.setData(
    'text/plain',
    String(id)
  );

  e.currentTarget
    .classList
    .add('dragging');

}


function dragEndCandidate(e){

  e.currentTarget
    .classList
    .remove('dragging');

  $$('.column')
    .forEach(
      x=>x.classList.remove(
        'drag-over'
      )
    );

}


function dragOverStage(e){

  e.preventDefault();

  e.dataTransfer.dropEffect =
    'move';

  e.currentTarget
    .classList
    .add('drag-over');

}


function dragLeaveStage(e){

  e.currentTarget
    .classList
    .remove('drag-over');

}


function dropStage(e,stage){

  e.preventDefault();

  const id =
    +e.dataTransfer.getData(
      'text/plain'
    );

  const c =
    state.candidates.find(
      x=>x.id===id
    );

  if(!c)
    return;

  c.stage =
    stage;

  c.updated =
    '방금 이동';

  /*
   불합격 단계에서 사유가 비어 있어도
   나중에 상세에서 입력할 수 있도록 유지
  */

  save();

  renderCandidates();

  toast(
    `${c.name || '지원자'} → ${stages[stage]}`
  );

}


/* ============================================================
   ATS 계산
   ============================================================ */

function computeAnalysis(c,j){

  if(!c || !j){

    return {
      score:0,
      hit:[],
      miss:[],
      base:0,
      exp:0,
      edu:0
    };

  }


  /*
   * ----------------------------------------
   * 1. JD 핵심 키워드
   * ----------------------------------------
   */

  const keywords =
    Array.isArray(j.keywords)
      ? j.keywords
          .map(
            k=>String(k).trim()
          )
          .filter(Boolean)
      : [];


  /*
   * ----------------------------------------
   * 2. 지원자의 전체 경력/역량 텍스트 구성
   *
   * 기존에는 resume + skills만 사용했지만
   * 이제 Gemini가 분석한 keyCareers까지 사용
   * ----------------------------------------
   */

  let careerText = '';


  if(Array.isArray(c.keyCareers)){

    careerText +=
      c.keyCareers
        .map(x=>{

          return [
            x.company || '',
            x.position || '',
            x.period || '',
            x.description || ''
          ].join(' ');

        })
        .join(' ');

  }


  careerText +=
    ' ' +
    (c.careerSummary || '') +
    ' ' +
    (c.careerDetail || '');


  const skillsText =
    Array.isArray(c.skills)
      ? c.skills.join(' ')
      : String(c.skills || '');


  const resumeText =
    String(c.resume || '');


  const text =
    (
      resumeText +
      ' ' +
      careerText +
      ' ' +
      skillsText
    ).toLowerCase();


  /*
   * ----------------------------------------
   * 3. JD 키워드 매칭
   * ----------------------------------------
   */

  const hit =
    keywords.filter(
      k=>{

        const keyword =
          String(k)
            .toLowerCase()
            .trim();

        return text.includes(
          keyword
        );

      }
    );


  const miss =
    keywords.filter(
      k=>!hit.includes(k)
    );


  /*
   * 키워드 매칭률
   *
   * 전체 점수 중 최대 40점
   */

  const keywordRate =
    keywords.length
      ? hit.length / keywords.length
      : 0;


  const keywordScore =
    Math.round(
      keywordRate * 40
    );


  /*
   * ----------------------------------------
   * 4. 직무 경력 적합도
   *
   * keyCareers + careerSummary + careerDetail
   * 를 이용해서 실제 직무 관련 경력을 판단
   * ----------------------------------------
   */

  let careerMatchCount = 0;


  if(keywords.length){

    careerMatchCount =
      keywords.filter(
        k=>{

          const keyword =
            String(k)
              .toLowerCase()
              .trim();

          return careerText
            .toLowerCase()
            .includes(keyword);

        }
      ).length;

  }


  const careerRate =
    keywords.length
      ? careerMatchCount / keywords.length
      : 0;


  /*
   * 직무경력 점수 최대 30점
   */

  let careerScore =
    Math.round(
      careerRate * 30
    );


  /*
   * ----------------------------------------
   * 5. 경력연차
   *
   * 9년이면 최대 15점
   * ----------------------------------------
   */

  const years =
    Number(c.years) || 0;


  const exp =
    Math.min(
      15,
      Math.round(
        years * 1.8
      )
    );


  /*
   * ----------------------------------------
   * 6. 핵심 스킬
   *
   * skills와 JD 키워드를 비교
   *
   * 최대 10점
   * ----------------------------------------
   */

  let skillMatchCount = 0;


  if(
    Array.isArray(c.skills) &&
    keywords.length
  ){

    skillMatchCount =
      c.skills.filter(
        skill=>{

          const s =
            String(skill)
              .toLowerCase()
              .trim();

          return keywords.some(
            k=>{

              const keyword =
                String(k)
                  .toLowerCase()
                  .trim();

              return (
                s.includes(keyword) ||
                keyword.includes(s)
              );

            }
          );

        }
      ).length;

  }


  const skillRate =
    keywords.length
      ? Math.min(
          1,
          skillMatchCount /
          Math.max(
            1,
            keywords.length
          )
        )
      : 0;


  const skillScore =
    Math.min(
      10,
      Math.round(
        skillRate * 10
      )
    );


  /*
   * ----------------------------------------
   * 7. 학력
   *
   * 최대 5점
   * ----------------------------------------
   */

  const education =
    String(
      c.education || ''
    );


  const edu =
    /박사/i.test(
      education
    )
      ? 5
      : /석사|mba/i.test(
          education
        )
        ? 5
        : /학사|대학교|대학/i.test(
            education
          )
          ? 4
          : 2;


  /*
   * ----------------------------------------
   * 8. 최종 점수
   *
   * 키워드       40
   * 직무경력     30
   * 경력연차     15
   * 핵심스킬     10
   * 학력          5
   * ----------------
   * 총점        100
   * ----------------------------------------
   */

  const score =
    Math.min(
      100,
      Math.round(
        keywordScore +
        careerScore +
        exp +
        skillScore +
        edu
      )
    );


  /*
   * 기존 화면에서 사용하는 base 값은
   * 키워드 매칭률을 그대로 유지
   */

  const base =
    Math.round(
      keywordRate * 100
    );


  return {

    score,

    hit,

    miss,

    base,

    exp,

    edu

  };

}

function renderAnalysis(){

  const page = $('#page');

  if(!page) return;

  const jobId =
    state.analysisJobId ||
    state.selectedJobId ||
    (
      state.jobs[0]
        ? state.jobs[0].id
        : ''
    );

  const candidateId =
    state.analysisCandidateId ||
    state.selectedCandidateId ||
    '';

  const jobs =
    Array.isArray(state.jobs)
      ? state.jobs
      : [];

  const candidates =
    Array.isArray(state.candidates)
      ? state.candidates
      : [];

  const selectedJob =
    jobs.find(
      j =>
        String(j.id) ===
        String(jobId)
    );

  let filteredCandidates =
    candidates;

  if(selectedJob){

    filteredCandidates =
      candidates.filter(
        c =>
          String(
            c.jobId ||
            c.job ||
            c.jobPostId ||
            ''
          ) ===
          String(selectedJob.id)
      );

  }

  if(
    selectedJob &&
    filteredCandidates.length === 0 &&
    candidates.length > 0
  ){

    filteredCandidates =
      candidates;

  }

  const selectedCandidate =
    filteredCandidates.find(
      c =>
        String(c.id) ===
        String(candidateId)
    );

  const totalCandidates =
    filteredCandidates.length;

  const averageScore =
    selectedJob && totalCandidates
      ? Math.round(
          filteredCandidates.reduce(
            (sum,c)=>{
              const a =
                computeAnalysis(
                  c,
                  selectedJob
                );

              return sum + a.score;
            },
            0
          ) /
          totalCandidates
        )
      : 0;

  const highCandidates =

function openAnalysis(cid){

  const c =
    state.candidates.find(
      x=>x.id===cid
    );

  if(!c)
    return;

  state.page =
    'analysis';

  render();

  requestAnimationFrame(
    ()=>{
      showAnalysis(
        c.id,
        c.job
      );
    }
  );

}

function runAnalysis(){

  const cand =
    $('#analysisCand');

  const job =
    $('#analysisJob');

  if(!cand || !job){

    toast(

  showAnalysis(

  );

}

function renderReports(){

  const page = $('#page');

  if(!page) return;

  const jobs =
    Array.isArray(state.jobs)
      ? state.jobs
      : [];

  const candidates =
    Array.isArray(state.candidates)
      ? state.candidates
      : [];


  const totalJobs =
    jobs.length;


  const totalCandidates =
    candidates.length;


  const getCandidateJob =
    c => {

      const jobId =
        c.jobId ||
        c.job ||
        c.jobPostId ||
        '';

      return jobs.find(
        j =>
          String(j.id) ===
          String(jobId)
      );

    };


  const stageMap = {

    applied:
      '지원',

    review:
      '서류검토',

    interview1:
      '1차면접',

    interview2:
      '2차면접',

    final:
      '최종면접',

    hired:
      '최종합격'

  };


const stageKeys = [
  0,
  1,
  2,
  3,
  4,
  5
];


const stageLabels = [
  '지원',
  '서류검토',
  '1차면접',
  '2차면접',
  '최종합격',
  '불합격'
];


const stageCounts =
  stageKeys.map(
    key => {

      return candidates.filter(
        c =>
          Number(c.stage) === key
      ).length;

    }
  );


const hiredCount =
  candidates.filter(
    c =>
      Number(c.stage) === 4
  ).length;


  const totalScore =
    candidates.reduce(
      (sum,c) => {

        const job =
          getCandidateJob(c);

        if(!job)
          return sum;

        const analysis =
          computeAnalysis(
            c,
            job
          );

        return (
          sum +
          (
            Number(
              analysis.score
            ) || 0
          )
        );

      },
      0
    );


  const scoredCandidates =
    candidates.filter(
      c =>
        getCandidateJob(c)
    );


  const averageScore =
    scoredCandidates.length
      ? Math.round(
          totalScore /
          scoredCandidates.length
        )
      : 0;


  const conversionRate =
    totalCandidates
      ? Math.round(
          (
            hiredCount /
            totalCandidates
          ) * 100
        )
      : 0;

    jobs.map(

        const jobCandidates =

                c.jobPostId ||

          );


        let scoreTotal = 0;

        jobCandidates.forEach(

              )

const hired =
  jobCandidates.filter(
    c =>
      Number(c.stage) === 4
  ).length;


        const conversion =

        return {

    },

function renderSettings(){

  const page = $('#page');

  if(!page)
    return;


  const section =
    state.settingsSection ||
    'main';


  if(section === 'ai'){
    renderSettingsAI();
    return;
  }


  if(section === 'ats'){
    renderSettingsATS();
    return;
  }


  if(section === 'data'){
    renderSettingsData();
    return;
  }


  if(section === 'about'){
    renderSettingsAbout();
    return;
  }


  renderSettingsMain();

}

function saveJob(id){

  const o = {

    id:
      id ||
      Date.now(),

    title:
      $('#jtitle').value.trim(),

    dept:
      $('#jdept').value.trim(),

    location:
      $('#jloc').value.trim(),

    status:
      '진행중',

    open:
      $('#jopen').value,

    close:
      $('#jclose').value,

    jd:
      $('#jjd').value,

    keywords:
      $('#jkeys')
        .value
        .split(/[,\n]+/)
        .map(
          x=>x.trim()
        )
        .filter(Boolean)

  };


  if(!o.title){

    toast(
      '공고명을 입력해주세요.'
    );

    return;

  }


  if(id){

    state.jobs =
      state.jobs.map(
        j=>
          j.id===id
            ? o
            : j
      );

  }else{

    state.jobs.push(o);

  }


  save();

  closeModal();

  render();

  toast(
    '채용공고가 저장되었습니다.'
  );

}

/* ============================================================

   ============================================================ */

async function handleResumePdf(file){

  if(!file)
    return;


  if(
    file.type !== 'application/pdf' &&
    !/\.pdf$/i.test(file.name)
  ){

    toast(
      'PDF 파일만 업로드할 수 있습니다.'
    );

    return;

  }


  if(
    file.size >
    20 * 1024 * 1024
  ){

    toast(
      'PDF는 20MB 이하로 업로드하세요.'
    );

    return;

  }


  const status =
    $('#fileStatus');


  status.innerHTML = `

    <div class="file-pill">

      <span>
        📄 ${esc(file.name)}
      </span>

      <span class="ai-status">
        PDF 읽는 중…
      </span>

    </div>

  `;


  try{

    let text = '';

    try{

      text =
        await extractPdfText(
          file
        );

    }catch(pdfErr){

      console.warn(
        'PDF.js text extraction skipped:',
        pdfErr
      );

    }


    $('#cres').value =
      text;


    const f =
      estimateResumeFields(
        text
      );


    if(f.email)
      $('#cemail').value =
        f.email;


    if(f.years)
      $('#cyears').value =
        f.years;


    status.innerHTML = `

      <div class="file-pill">

        <span>
          📄 ${esc(file.name)}
        </span>

        <span class="ai-status">
          PDF 확인 완료 · Gemini 자동 분석 중…
        </span>

      </div>

    `;


    await analyzeCurrentResume(
      true,
      file.name,
      file
    );


  }catch(e){

    console.error(e);

    status.innerHTML = `

      <div
        class="notice"
        style="
          background:#fef2f2;
          color:#b91c1c
        "
      >

        <b>
          분석 실패
        </b>

        <br>

        ${esc(
          e.message ||
          'PDF 처리 중 오류가 발생했습니다.'
        )}

      </div>

    `;

  }

}

/* ============================================================
   지원자 저장
   ============================================================ */

function saveCandidate(id){

  const jobId =
    +$('#cjob').value;


  const job =
    state.jobs.find(
      x=>x.id===jobId
    );


  if(!job){

    toast(
      '먼저 채용공고를 등록해주세요.'
    );

    return;

  }


  const existing =
    id
      ? state.candidates.find(
          x=>x.id===id
        )
      : null;


  /*
    주요 경력 텍스트를
    저장 가능한 배열 형태로 변환
  */

  const careerText =
    $('#ccareer')?.value?.trim() ||
    '';


  const keyCareers =
    careerText

      ? careerText
          .split(/\n\s*\n/)
          .map(
            block=>{

              const lines =
                block
                  .split('\n')
                  .map(
                    x=>x.trim()
                  )
                  .filter(Boolean);


              const header =
                lines[0] || '';


              const parts =
                header
                  .split('|')
                  .map(
                    x=>x.trim()
                  );


              return {

                company:
                  parts[0] || '',

                position:
                  parts[1] || '',

                period:
                  parts[2] || '',

                description:
                  lines
                    .slice(1)
                    .join(' ')
                    .trim()

              };

            }
          )
          .filter(
            x =>
              x.company ||
              x.position ||
              x.period ||
              x.description
          )

      : [];


  const c = {

    id:
      id ||
      Date.now(),


    job:
      jobId,


    name:
      $('#cname').value.trim(),


    email:
      $('#cemail').value.trim(),


    phone:
      $('#cphone')?.value.trim() ||
      '',


    stage:
      existing
        ? Number(existing.stage)||0
        : 0,


    years:
      +$('#cyears').value || 0,


    education:
      $('#cedu').value.trim(),


    skills:
      $('#cskills')
        .value
        .split(/[，,\n]+/)
        .map(
          x=>x.trim()
        )
        .filter(Boolean),


    /*
      이력서 원문
    */

    resume:
      $('#cres').value.trim(),


    /*
      지원자 핵심 요약
    */

    resumeSummary:
      $('#csummary').value.trim(),


    /*
      전체 경력 요약
    */

    careerSummary:
      $('#ccareerSummary')?.value.trim() ||
      '',


    /*
      주요 경력 구조화 데이터
    */

    keyCareers:
      keyCareers,


    /*
      주요 경력 표시용 텍스트
      기존 데이터 호환을 위해 유지
    */

    careerDetail:
      careerText,


    rejectReason:
      $('#creason')?.value ||
      '',


    updated:
      '방금 전'

  };


  /*
    기존 ATS 계산 기능 유지
  */

  const a =
    computeAnalysis(
      c,
      job
    );


  c.score =
    a.score;


  /*
    수정
  */

  if(id){

    state.candidates =
      state.candidates.map(
        x=>
          x.id===id
            ? c
            : x
      );

  }else{

    /*
      신규 지원자는 누적
    */

    state.candidates.push(c);

  }


  save();

  closeModal();

  state.page =
    'candidates';

  render();


  toast(
    `지원자 저장 완료 · ATS ${c.score}점`
  );

}

/* ============================================================
   채용공고 삭제
   ============================================================ */

function deleteJob(id){

  const j =
    state.jobs.find(
      x=>x.id===id
    );

  if(!j)
    return;


  const count =
    state.candidates.filter(
      c=>c.job===id
    ).length;


  const message =

    `채용공고 "${j.title}"을(를) 삭제하시겠습니까?\n\n` +

    `연결된 지원자 ${count}명도 함께 삭제됩니다.\n\n` +

    `이 작업은 되돌릴 수 없습니다.`;


  if(
    !confirm(message)
  )
    return;


  state.jobs =
    state.jobs.filter(
      x=>x.id!==id
    );


  state.candidates =
    state.candidates.filter(
      c=>c.job!==id
    );


  if(
    String(state.jobFilter) ===
    String(id)
  ){

    state.jobFilter =
      'all';

  }


  save();

  render();

  toast(
    '채용공고와 연결 지원자가 삭제되었습니다.'
  );

}


/* ============================================================
   지원자 삭제
   ============================================================ */

function deleteCandidate(id){

  const c =
    state.candidates.find(
      x=>x.id===id
    );

  if(!c)
    return;


  if(
    !confirm(
      `지원자 "${c.name || '이름 미확인'}"을(를) 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`
    )
  )
    return;


  state.candidates =
    state.candidates.filter(
      x=>x.id!==id
    );


  save();

  closeModal();

  state.page =
    'candidates';

  render();

  toast(
    '지원자가 삭제되었습니다.'
  );

}

/* ============================================================
   Modal
   ============================================================ */

function openModal(){

  $('#modal')
    .classList
    .add('open');

}


function closeModal(){

  $('#modal')
    .classList
    .remove('open');

}


$('#modal')
  .addEventListener(
    'click',
    e=>{

      if(
        e.target.id ===
        'modal'
      ){

        closeModal();

      }

    }
  );


/* ============================================================
   ESC로 Modal 닫기
   ============================================================ */

document.addEventListener(
  'keydown',
  e=>{

    if(
      e.key==='Escape'
    ){

      closeModal();

    }

  }
);


/* ============================================================
   홈 버튼
   ============================================================ */

$('#homeBtn').onclick = ()=>{

  /*
    중요:
    홈으로 이동할 뿐,
    데이터를 초기화하지 않습니다.
  */

  go('dashboard');

};


/* ============================================================
   새 채용공고
   ============================================================ */

$('#newJobBtn').onclick =
  ()=>openJob();


/* ============================================================
   데모 데이터
   ============================================================ */

$('#seedBtn').onclick = ()=>{

  const answer =
    confirm(

      '현재 저장된 채용공고와 지원자 데이터가 모두 데모 데이터로 교체됩니다.\n\n' +

      '실제 데이터가 있다면 먼저 백업했는지 확인하세요.\n\n' +

      '계속하시겠습니까?'

    );


  if(!answer)
    return;


  /*
    AI Key는 유지.
    데모 데이터만 교체.
  */

  const currentAiKey =
    state.aiKey ||
    GEMINI_API_KEY;


  state =
    normalizeState({

      ...createDefaultState(),

      jobs:
        structuredClone(
          demoJobs
        ),

      candidates:
        structuredClone(
          demoCandidates
        ),

      page:
        'dashboard',

      aiKey:
        currentAiKey

    });


  save();

  render();

  toast(
    '데모 데이터를 불러왔습니다.'
  );

};


/* ============================================================
   사이드바
   ============================================================ */

$$('.nav button')
  .forEach(
    b=>{

      b.onclick =
        ()=>go(
          b.dataset.page
        );

    }
  );


/* ============================================================
   앱이 백그라운드로 갈 때 한 번 더 저장
   ============================================================ */

document.addEventListener(
  'visibilitychange',
  ()=>{

    if(
      document.visibilityState ===
      'hidden'
    ){

      save();

    }

  }
);


/* ============================================================
   초기 실행
   ============================================================ */

load();

</script>

<script>

/* =========================================================
   STEP 9-4
   Mobile Bottom Navigation
   ========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function(){

    const nav =
      document.getElementById(
        'mobileBottomNav'
      );

    if(!nav){
      return;
    }

    nav
      .querySelectorAll('button')
      .forEach(
        function(button){

          button.addEventListener(
            'click',
            function(){

              const page =
                button.dataset.page;

              if(
                typeof go === 'function'
              ){

                go(page);

              }

            }
          );

        }
      );

  }
);


/* 현재 페이지 표시 */

function updateMobileBottomNav(){

  const nav =
    document.getElementById(
      'mobileBottomNav'
    );

  if(!nav){
    return;
  }

  nav
    .querySelectorAll('button')
    .forEach(
      function(button){

        button.classList.toggle(
          'active',
          button.dataset.page ===
          state.page
        );

      }
    );

}

</script>
