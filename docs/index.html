<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K-ATS Studio v1.1 · 한국형 채용관리 시스템</title>

<style>
:root{
  --bg:#f4f6fa;
  --panel:#fff;
  --text:#172033;
  --muted:#6d7587;
  --line:#e6e9ef;
  --primary:#4f46e5;
  --primary2:#6366f1;
  --green:#16a34a;
  --amber:#d97706;
  --red:#dc2626;
  --shadow:0 10px 30px rgba(24,32,56,.07);
  --radius:18px
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;
  background:var(--bg);
  color:var(--text)
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  display:flex;
  min-height:100vh
}

.sidebar{
  width:250px;
  background:#111827;
  color:#fff;
  padding:22px 16px;
  position:sticky;
  top:0;
  height:100vh
}

.brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.5px;
  padding:10px 12px 22px
}

.brand span{color:#a5b4fc}

.nav{
  display:grid;
  gap:7px
}

.nav button{
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:12px 14px;
  border-radius:11px
}

.nav button.active,
.nav button:hover{
  background:#1f2937;
  color:#fff
}

.side-foot{
  position:absolute;
  bottom:18px;
  left:18px;
  right:18px;
  color:#9ca3af;
  font-size:12px;
  line-height:1.6
}

.main{
  flex:1;
  min-width:0
}

.topbar{
  min-height:70px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:10px 28px;
  position:sticky;
  top:0;
  z-index:10
}

.top-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0
}

.topbar h1{
  font-size:20px;
  margin:0;
  white-space:nowrap
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 14px;
  border-radius:10px;
  font-weight:700
}

.btn:hover{
  background:#f8fafc
}

.btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}

.btn.primary:hover{
  background:#4338ca
}

.btn.ghost{
  background:#f7f8ff;
  color:var(--primary);
  border-color:#dde0ff
}

.home-btn{
  background:#f7f8ff;
  color:var(--primary);
  border-color:#dde0ff
}

.save-status{
  color:#15803d;
  font-size:11px;
  font-weight:700;
  white-space:nowrap
}

.page{
  padding:26px 28px 48px;
  max-width:1500px;
  margin:auto
}

.grid{
  display:grid;
  gap:18px
}

.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px
}

.stat{
  display:flex;
  justify-content:space-between;
  align-items:flex-start
}

.stat .num{
  font-size:30px;
  font-weight:800;
  margin-top:6px
}

.muted{color:var(--muted)}

.eyebrow{
  font-size:12px;
  color:var(--muted);
  font-weight:700
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}

.title-row h2{
  font-size:18px;
  margin:0
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800
}

.b-blue{background:#eef2ff;color:#4338ca}
.b-green{background:#ecfdf3;color:#15803d}
.b-amber{background:#fff7ed;color:#c2410c}
.b-red{background:#fef2f2;color:#b91c1c}
.b-gray{background:#f3f4f6;color:#4b5563}

.bar{
  height:8px;
  background:#eef0f4;
  border-radius:10px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--primary),#8b5cf6);
  border-radius:10px
}

.kpi-list{
  display:grid;
  gap:13px
}

.kpi-line{
  display:grid;
  grid-template-columns:130px 1fr 60px;
  gap:12px;
  align-items:center;
  font-size:13px
}

.table{
  width:100%;
  border-collapse:separate;
  border-spacing:0
}

.table th,
.table td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  text-align:left
}

.table th{
  color:var(--muted);
  font-size:12px;
  background:#fafbfc
}

.table tr:last-child td{
  border-bottom:0
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#eef2ff;
  color:#4338ca;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800
}

.person{
  display:flex;
  align-items:center;
  gap:10px
}

.score{
  font-size:22px;
  font-weight:900
}

.score.good{color:var(--green)}
.score.mid{color:var(--amber)}
.score.low{color:var(--red)}

.stage-summary{
  display:flex;
  gap:10px;
  margin:0 0 14px;
  flex-wrap:wrap
}

.stage-summary>div{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 12px;
  font-size:12px
}

.stage-summary b{
  margin-left:4px
}

.stage-summary .reject-summary{
  color:#b91c1c;
  border-color:#fecaca;
  background:#fff7f7
}

.board{
  display:grid;
  grid-template-columns:repeat(6,minmax(220px,1fr));
  gap:12px;
  align-items:start;
  overflow-x:auto;
  padding-bottom:4px
}

.column{
  background:#eef1f6;
  border-radius:15px;
  padding:10px;
  min-height:420px
}

.reject-column{
  background:#fff1f1;
  border:1px solid #fecaca
}

.column-head{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  font-size:13px;
  padding:5px 4px 10px
}

.candidate{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  margin-bottom:9px;
  box-shadow:0 5px 14px rgba(0,0,0,.04);
  transition:.15s
}

.candidate:hover{
  transform:translateY(-1px)
}

.candidate.dragging{
  opacity:.45;
  transform:rotate(1deg)
}

.column.drag-over{
  outline:2px dashed var(--primary);
  background:#eef2ff
}

.dropzone{
  border:2px dashed #cfd4e1;
  border-radius:14px;
  padding:18px;
  text-align:center;
  background:#fafbff;
  color:var(--muted);
  cursor:pointer
}

.dropzone:hover{
  border-color:#a5b4fc;
  background:#f7f8ff
}

.file-pill{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:9px 11px;
  background:#f7f8ff;
  border-radius:10px;
  font-size:12px;
  margin-top:8px
}

.ai-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted)
}

.cand-top{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.cand-name{
  font-weight:800
}

.cand-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px
}

.chip{
  font-size:10px;
  border:1px solid #e5e7eb;
  padding:4px 6px;
  border-radius:6px;
  background:#fafafa
}

.cand-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:12px
}

.link-btn{
  border:0;
  background:transparent;
  color:var(--primary);
  font-weight:800;
  font-size:12px;
  padding:0
}

.field{
  display:grid;
  gap:7px;
  margin-bottom:13px
}

.field label{
  font-size:12px;
  font-weight:800;
  color:#475569
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  background:#fff;
  outline:0
}

.field textarea{
  min-height:150px;
  resize:vertical
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#a5b4fc;
  box-shadow:0 0 0 3px #eef2ff
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap
}

.empty{
  padding:55px 15px;
  text-align:center;
  color:var(--muted)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:30
}

.modal.open{
  display:flex
}

.modal-box{
  background:#fff;
  max-width:920px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:24px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px
}

.close{
  border:0;
  background:#f3f4f6;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:18px;
  flex:none
}

.analysis-grid{
  display:grid;
  grid-template-columns:250px 1fr;
  gap:18px
}

.score-ring{
  border-radius:50%;
  width:170px;
  height:170px;
  background:conic-gradient(
    var(--primary) calc(var(--score)*1%),
    #eceff3 0
  );
  display:grid;
  place-items:center;
  margin:5px auto 15px;
  position:relative
}

.score-ring:after{
  content:'';
  width:128px;
  height:128px;
  border-radius:50%;
  background:#fff;
  position:absolute
}

.ring-inner{
  position:relative;
  z-index:2;
  font-size:34px;
  font-weight:900
}

.keyword-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.keyword{
  padding:7px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:700
}

.kw-hit{
  background:#ecfdf3;
  color:#15803d
}

.kw-miss{
  background:#fef2f2;
  color:#b91c1c
}

.notice{
  padding:12px;
  border-radius:11px;
  background:#f7f8ff;
  color:#4f46e5;
  font-size:12px;
  line-height:1.6
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:18px
}

.tabs button{
  border:0;
  background:#eef0f6;
  padding:9px 12px;
  border-radius:9px;
  font-size:12px;
  font-weight:800
}

.tabs button.active{
  background:#1f2937;
  color:#fff
}

.searchrow{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px
}

.searchrow input,
.searchrow select{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  background:#fff
}

.right{
  margin-left:auto
}

.mini{
  font-size:11px
}

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#111827;
  color:#fff;
  padding:12px 15px;
  border-radius:10px;
  opacity:0;
  transform:translateY(10px);
  transition:.2s;
  z-index:40;
  font-size:13px
}

.toast.show{
  opacity:1;
  transform:translateY(0)
}

.version{
  font-size:10px;
  color:#64748b;
  margin-top:8px
}

.data-info{
  margin-top:10px;
  padding:10px 12px;
  border-radius:10px;
  background:#f8fafc;
  border:1px solid var(--line);
  font-size:11px;
  color:var(--muted)
}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,minmax(220px,1fr))}
  .analysis-grid{grid-template-columns:1fr}
  .sidebar{width:210px}
}

@media(max-width:720px){

  .sidebar{
    display:none
  }

  .mobile-menu-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:#fff;
    font-size:22px;
    font-weight:800;
    flex:none;
  }

  .mobile-menu{
    display:none;
    position:fixed;
    top:70px;
    left:10px;
    right:10px;
    background:#111827;
    border-radius:14px;
    padding:10px;
    z-index:100;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }

  .mobile-menu.open{
    display:grid;
    gap:5px;
  }

  .mobile-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#cbd5e1;
    text-align:left;
    padding:14px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
  }

  .mobile-menu button.active,
  .mobile-menu button:active{
    background:#1f2937;
    color:#fff;
  }

  .topbar{
    padding:10px 14px;
    align-items:flex-start
  }

  .top-left{
    align-items:center
  }

  .topbar h1{
    font-size:17px
  }

  .top-actions{
    gap:6px
  }

  .top-actions .seed-btn{
    display:none
  }

  .save-status{
    display:none
  }

  .home-btn{
    padding:9px 10px
  }

  .page{
    padding:18px
  }

  .g4,
  .g3,
  .g2{
    grid-template-columns:1fr
  }

  .board{
    grid-template-columns:1fr
  }

  .kpi-line{
    grid-template-columns:105px 1fr 50px
  }

  .modal{
    padding:10px
  }

  .modal-box{
    padding:18px;
    max-height:94vh
  }

  .title-row{
    align-items:flex-start;
    flex-direction:column
  }

  .title-row>button,
  .title-row>div+button{
    align-self:flex-end
  }
}

  .topbar{
    padding:10px 14px;
    align-items:flex-start
  }

  .top-left{
    align-items:center
  }

  .topbar h1{
    font-size:17px
  }

  .top-actions{
    gap:6px
  }

  .top-actions .seed-btn{
    display:none
  }

  .save-status{
    display:none
  }

  .home-btn{
    padding:9px 10px
  }

  .page{
    padding:18px
  }

  .g4,
  .g3,
  .g2{
    grid-template-columns:1fr
  }

  .board{
    grid-template-columns:1fr
  }

  .kpi-line{
    grid-template-columns:105px 1fr 50px
  }

  .modal{
    padding:10px
  }

  .modal-box{
    padding:18px;
    max-height:94vh
  }

  .title-row{
    align-items:flex-start;
    flex-direction:column
  }

  .title-row>button,
  .title-row>div+button{
    align-self:flex-end
  }
}
</style>
</head>

</header>

<div class="mobile-menu" id="mobileMenu">

</div>

<div class="page" id="page"></div>

  </main>

</div>

<div class="modal" id="modal">

</div>

<div class="toast" id="toast"></div>

let state = {

  jobs:[],

  candidates:[],

  page:'dashboard',

  jobFilter:'all',

  query:'',

  aiKey:GEMINI_API_KEY,

  version:APP_VERSION,

  lastSavedAt:null

};


let pdfModulePromise = null;


/* ============================================================
   기본 상태
   ============================================================ */

function createDefaultState(){

  return {

    jobs:[],

    candidates:[],

    page:'dashboard',

    jobFilter:'all',

    query:'',

    aiKey:GEMINI_API_KEY,

    version:APP_VERSION,

    lastSavedAt:null

  };

}


/* ============================================================
   상태 정리 / 기존 데이터 호환
   ============================================================ */

function normalizeState(saved){

  const base = createDefaultState();

  const s = saved && typeof saved === 'object'
    ? saved
    : {};

  return {

    ...base,

    ...s,

    jobs:Array.isArray(s.jobs)
      ? s.jobs
      : [],

    candidates:Array.isArray(s.candidates)
      ? s.candidates
      : [],

    page:[
      'dashboard',
      'jobs',
      'candidates',
      'analysis',
      'reports'
    ].includes(s.page)
      ? s.page
      : 'dashboard',

    jobFilter:
      s.jobFilter !== undefined
        ? s.jobFilter
        : 'all',

    query:
      typeof s.query === 'string'
        ? s.query
        : '',

    aiKey:
      typeof s.aiKey === 'string'
        ? s.aiKey
        : GEMINI_API_KEY,

    version:APP_VERSION

  };

}


/* ============================================================
   저장
   ============================================================ */

function save(){

  try{

    state.version = APP_VERSION;

    state.lastSavedAt = new Date().toISOString();

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

    updateSaveStatus();

    return true;

  }catch(error){

    console.error(
      'K-ATS 데이터 저장 실패:',
      error
    );

    const status = $('#saveStatus');

    if(status){

      status.textContent =
        '● 저장 실패';

      status.style.color =
        '#dc2626';

    }

    toast(
      '데이터 저장에 실패했습니다. 브라우저 저장공간을 확인하세요.'
    );

    return false;

  }

}

   ============================================================ */

function toast(text){

  const e =
    $('#toast');

  if(!e) return;

  e.textContent =
    text;

  e.classList.add('show');

  clearTimeout(
    e._timer
  );

  e._timer =
    setTimeout(
      ()=>{
        e.classList.remove('show');
      },
      2200
    );

}


/* ============================================================
   HTML escape
   ============================================================ */

function esc(s){

  return String(s ?? '')
    .replace(
      /[&<>'"]/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c])
    );

}


/* ============================================================
   PDF.js
   ============================================================ */

function initPdf(){

  return pdfModulePromise ||
    (
      pdfModulePromise =
        import(
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs'
        )
        .then(m=>{

          m.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

          return m;

        })
    );

}


async function extractPdfText(file){

  const pdfjs =
    await initPdf();

  const ab =
    await file.arrayBuffer();

  const pdf =
    await pdfjs.getDocument({
      data:ab
    }).promise;

  let out = [];

  for(
    let i=1;
    i<=pdf.numPages;
    i++
  ){

    const page =
      await pdf.getPage(i);

    const c =
      await page.getTextContent();

    out.push(
      c.items
        .map(x=>x.str)
        .join(' ')
    );

  }

  return out.join('\n');

}


/* ============================================================
   PDF 기본 정보 추출
   ============================================================ */

function estimateResumeFields(text){

  const t =
    text.replace(/\s+/g,' ');

  const email =
    (
      t.match(
        /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
      ) || []
    )[0] || '';

  const phone =
    (
      t.match(
        /(?:01[016789]|02|0[3-9][0-9])[- .]?\d{3,4}[- .]?\d{4}/
      ) || []
    )[0] || '';

  const yearsMatch =
    t.match(
      /(?:경력|경력사항)[^0-9]{0,15}(\d{1,2})\s*년/
    );

  const years =
    yearsMatch
      ? +yearsMatch[1]
      : 0;

  return {
    email,
    phone,
    years
  };

}


/* ============================================================
   Gemini
   ============================================================ */

function cleanAiText(x){

  return String(x || '')
    .trim()
    .replace(/^```(?:json)?/,'')
    .replace(/```$/,'')
    .trim();

}


async function fileToBase64(file){

  const ab =
    await file.arrayBuffer();

  let binary = '';

  const bytes =
    new Uint8Array(ab);

  const chunk =
    0x8000;

  for(
    let i=0;
    i<bytes.length;
    i+=chunk
  ){

    binary +=
      String.fromCharCode(
        ...bytes.subarray(
          i,
          Math.min(
            i+chunk,
            bytes.length
          )
        )
      );

  }

  return btoa(binary);

}


function getGeminiApiKey(){

  const direct =
    String(
      GEMINI_API_KEY || ''
    ).trim();

  const saved =
    String(
      state.aiKey || ''
    ).trim();

  const placeholder =
    '여기에_GEMINI_API_KEY_붙여넣기';

  if(
    direct &&
    direct !== placeholder
  ){

    return direct;

  }

  if(
    saved &&
    saved !== placeholder
  ){

    return saved;

  }

  return '';

}


async function analyzeResumeWithGemini(
  text,
  jd,
  file
){

  const apiKey =
    getGeminiApiKey();

  if(!apiKey)
    return null;

  const prompt = `
당신은 대한민국 기업의 전문 HR 채용담당자다.

아래 이력서/경력기술서를 실제 채용 검토용 데이터로 구조화하라.

중요 규칙:
1. 이력서에 명시된 사실만 사용한다.
2. 없는 정보는 추측하지 않는다.
3. 이름, 이메일, 전화번호는 문서에 있는 값을 그대로 사용한다.
4. 총 경력은 문서에 기재된 근무기간을 기준으로 계산한다.
5. 지원공고는 사용자가 직접 선택하므로 반환하지 않는다.
6. 모든 결과는 반드시 JSON 객체 하나로 반환한다.
7. JSON 이외의 설명은 절대 작성하지 않는다.

반드시 아래 JSON 구조를 사용한다.

{
  "name": "",
  "email": "",
  "phone": "",
  "years": 0,
  "education": "",
  "skills": [],
  "careerSummary": "",
  "keyCareers": [
    {
      "company": "",
      "position": "",
      "period": "",
      "description": ""
    }
  ],
  "concerns": []
}

각 필드 설명:

name:
지원자 이름

email:
이메일 주소

phone:
휴대전화 번호

years:
총 경력연수.
숫자만 반환한다.
예: 7년 3개월이면 7

education:
최종학력 중심으로 작성한다.
예:
"중앙대학교 MBA"
"서울대학교 경영학과"

skills:
이력서에 실제로 등장하는 핵심 업무/기술/전문분야를 배열로 작성한다.
최대 10개.

careerSummary:
지원자 전체를 한눈에 이해할 수 있도록 2~4문장으로 작성한다.

keyCareers:
주요 경력을 회사별로 정리한다.

각 경력:
company = 회사명
position = 직무/직책
period = 근무기간
description = 핵심 업무와 성과를 1~3문장으로 정리

최대 6개까지만 작성한다.

concerns:
이력서에서 실제로 확인되는 주의사항만 작성한다.
없으면 [].

지원 JD:
${jd || '별도 JD 없음'}

PDF 텍스트:
${text || '(PDF 텍스트 추출 실패)'}

`;

  const parts = [
    {
      text: prompt
    }
  ];

  if(file){

    const data =
      await fileToBase64(file);

    parts.push({
      inlineData:{
        mimeType:'application/pdf',
        data:data
      }
    });

  }

  const r =
    await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/' +
      GEMINI_MODEL +
      ':generateContent',
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json',
          'x-goog-api-key':apiKey
        },

        body:JSON.stringify({

          contents:[
            {
              parts:parts
            }
          ],

          generationConfig:{
            responseMimeType:'application/json'
          }

        })
      }
    );

  const raw =
    await r.text();

  let data;

  try{

    data =
      JSON.parse(raw);

  }catch{

    throw new Error(
      'Gemini 응답을 읽을 수 없습니다.'
    );

  }

  if(!r.ok){

    const msg =
      data?.error?.message ||
      ('AI API 오류 ' + r.status);

    throw new Error(msg);

  }

  const out =
    (data.candidates || [])
      .flatMap(
        c=>c.content?.parts || []
      )
      .map(
        p=>p.text || ''
      )
      .join('');

  if(!out){

    throw new Error(
      'Gemini가 분석 결과를 반환하지 않았습니다.'
    );

  }

  const result =
    JSON.parse(
      cleanAiText(out)
    );

  return result;

}

/* ============================================================
   Drag & Drop
   ============================================================ */

function dragStartCandidate(e,id){

  e.stopPropagation();

  e.dataTransfer.effectAllowed =
    'move';

  e.dataTransfer.setData(
    'text/plain',
    String(id)
  );

  e.currentTarget
    .classList
    .add('dragging');

}


function dragEndCandidate(e){

  e.currentTarget
    .classList
    .remove('dragging');

  $$('.column')
    .forEach(
      x=>x.classList.remove(
        'drag-over'
      )
    );

}


function dragOverStage(e){

  e.preventDefault();

  e.dataTransfer.dropEffect =
    'move';

  e.currentTarget
    .classList
    .add('drag-over');

}


function dragLeaveStage(e){

  e.currentTarget
    .classList
    .remove('drag-over');

}


function dropStage(e,stage){

  e.preventDefault();

  const id =
    +e.dataTransfer.getData(
      'text/plain'
    );

  const c =
    state.candidates.find(
      x=>x.id===id
    );

  if(!c)
    return;

  c.stage =
    stage;

  c.updated =
    '방금 이동';

  /*
   불합격 단계에서 사유가 비어 있어도
   나중에 상세에서 입력할 수 있도록 유지
  */

  save();

  renderCandidates();

  toast(
    `${c.name || '지원자'} → ${stages[stage]}`
  );

}


/* ============================================================
   ATS 계산
   ============================================================ */

function computeAnalysis(c,j){

  if(!c || !j){

    return {
      score:0,
      hit:[],
      miss:[],
      base:0,
      exp:0,
      edu:0
    };

  }


  /*
   * ----------------------------------------
   * 1. JD 핵심 키워드
   * ----------------------------------------
   */

  const keywords =
    Array.isArray(j.keywords)
      ? j.keywords
          .map(
            k=>String(k).trim()
          )
          .filter(Boolean)
      : [];


  /*
   * ----------------------------------------
   * 2. 지원자의 전체 경력/역량 텍스트 구성
   *
   * 기존에는 resume + skills만 사용했지만
   * 이제 Gemini가 분석한 keyCareers까지 사용
   * ----------------------------------------
   */

  let careerText = '';


  if(Array.isArray(c.keyCareers)){

    careerText +=
      c.keyCareers
        .map(x=>{

          return [
            x.company || '',
            x.position || '',
            x.period || '',
            x.description || ''
          ].join(' ');

        })
        .join(' ');

  }


  careerText +=
    ' ' +
    (c.careerSummary || '') +
    ' ' +
    (c.careerDetail || '');


  const skillsText =
    Array.isArray(c.skills)
      ? c.skills.join(' ')
      : String(c.skills || '');


  const resumeText =
    String(c.resume || '');


  const text =
    (
      resumeText +
      ' ' +
      careerText +
      ' ' +
      skillsText
    ).toLowerCase();


  /*
   * ----------------------------------------
   * 3. JD 키워드 매칭
   * ----------------------------------------
   */

  const hit =
    keywords.filter(
      k=>{

        const keyword =
          String(k)
            .toLowerCase()
            .trim();

        return text.includes(
          keyword
        );

      }
    );


  const miss =
    keywords.filter(
      k=>!hit.includes(k)
    );


  /*
   * 키워드 매칭률
   *
   * 전체 점수 중 최대 40점
   */

  const keywordRate =
    keywords.length
      ? hit.length / keywords.length
      : 0;


  const keywordScore =
    Math.round(
      keywordRate * 40
    );


  /*
   * ----------------------------------------
   * 4. 직무 경력 적합도
   *
   * keyCareers + careerSummary + careerDetail
   * 를 이용해서 실제 직무 관련 경력을 판단
   * ----------------------------------------
   */

  let careerMatchCount = 0;


  if(keywords.length){

    careerMatchCount =
      keywords.filter(
        k=>{

          const keyword =
            String(k)
              .toLowerCase()
              .trim();

          return careerText
            .toLowerCase()
            .includes(keyword);

        }
      ).length;

  }


  const careerRate =
    keywords.length
      ? careerMatchCount / keywords.length
      : 0;


  /*
   * 직무경력 점수 최대 30점
   */

  let careerScore =
    Math.round(
      careerRate * 30
    );


  /*
   * ----------------------------------------
   * 5. 경력연차
   *
   * 9년이면 최대 15점
   * ----------------------------------------
   */

  const years =
    Number(c.years) || 0;


  const exp =
    Math.min(
      15,
      Math.round(
        years * 1.8
      )
    );


  /*
   * ----------------------------------------
   * 6. 핵심 스킬
   *
   * skills와 JD 키워드를 비교
   *
   * 최대 10점
   * ----------------------------------------
   */

  let skillMatchCount = 0;


  if(
    Array.isArray(c.skills) &&
    keywords.length
  ){

    skillMatchCount =
      c.skills.filter(
        skill=>{

          const s =
            String(skill)
              .toLowerCase()
              .trim();

          return keywords.some(
            k=>{

              const keyword =
                String(k)
                  .toLowerCase()
                  .trim();

              return (
                s.includes(keyword) ||
                keyword.includes(s)
              );

            }
          );

        }
      ).length;

  }


  const skillRate =
    keywords.length
      ? Math.min(
          1,
          skillMatchCount /
          Math.max(
            1,
            keywords.length
          )
        )
      : 0;


  const skillScore =
    Math.min(
      10,
      Math.round(
        skillRate * 10
      )
    );


  /*
   * ----------------------------------------
   * 7. 학력
   *
   * 최대 5점
   * ----------------------------------------
   */

  const education =
    String(
      c.education || ''
    );


  const edu =
    /박사/i.test(
      education
    )
      ? 5
      : /석사|mba/i.test(
          education
        )
        ? 5
        : /학사|대학교|대학/i.test(
            education
          )
          ? 4
          : 2;


  /*
   * ----------------------------------------
   * 8. 최종 점수
   *
   * 키워드       40
   * 직무경력     30
   * 경력연차     15
   * 핵심스킬     10
   * 학력          5
   * ----------------
   * 총점        100
   * ----------------------------------------
   */

  const score =
    Math.min(
      100,
      Math.round(
        keywordScore +
        careerScore +
        exp +
        skillScore +
        edu
      )
    );


  /*
   * 기존 화면에서 사용하는 base 값은
   * 키워드 매칭률을 그대로 유지
   */

  const base =
    Math.round(
      keywordRate * 100
    );


  return {

    score,

    hit,

    miss,

    base,

    exp,

    edu

  };

}

function showAnalysis(cid,jid){

  const c =
    state.candidates.find(
      x => String(x.id) === String(cid)
    );

  const j =
    state.jobs.find(
      x => String(x.id) === String(jid)
    );

  if(!c){
    alert('지원자 정보를 찾을 수 없습니다.');
    return;
  }

  const result =
    computeAnalysis(c,j);

  const coreSummary =
    c.careerSummary ||
    c.resumeSummary ||
    'AI 요약 없음';

  /*
   * 주요 경력은 반드시 keyCareers / careerDetail에서 가져온다.
   * resume를 fallback으로 사용하지 않는다.
   * 그래야 지원자 핵심 요약과 동일한 문장이 반복되지 않는다.
   */
  let careerDetail = '';

  if(
    Array.isArray(c.keyCareers) &&
    c.keyCareers.length
  ){
    careerDetail =
      c.keyCareers
        .map(
          x => {
            if(
              typeof x === 'string'
            ){
              return x;
            }

            if(
              x &&
              typeof x === 'object'
            ){
              return [
                x.company || '',
                x.position || x.role || '',
                x.period || x.duration || '',
                x.description || x.detail || ''
              ]
                .filter(Boolean)
                .join(' · ');
            }

            return '';
          }
        )
        .filter(Boolean)
        .join('\n');
  }
  else if(
    typeof c.keyCareers === 'string' &&
    c.keyCareers.trim()
  ){
    careerDetail =
      c.keyCareers.trim();
  }
  else if(
    c.careerDetail &&
    String(c.careerDetail).trim()
  ){
    careerDetail =
      String(c.careerDetail).trim();
  }

  /*
   * 주요 경력 데이터가 실제로 없는 경우에는
   * 지원자 핵심 요약을 복사하지 않고 안내문을 표시한다.
   */
  if(!careerDetail){
    careerDetail =
      '등록된 주요 경력 정보가 없습니다.';
  }

  const hitHtml =
    result.hit.length
      ? result.hit
          .map(
            k =>
              `<span class="tag">${escapeHtml(k)}</span>`
          )
          .join(' ')
      : '없음';

  const missHtml =
    result.miss.length
      ? result.miss
          .map(
            k =>
              `<span class="tag">${escapeHtml(k)}</span>`
          )
          .join(' ')
      : '없음';

  const jdKeywords =
    Array.isArray(j?.keywords)
      ? j.keywords
      : [];

  const jdKeywordHtml =
    jdKeywords.length
      ? jdKeywords
          .map(
            k =>
              `<span class="tag">${escapeHtml(k)}</span>`
          )
          .join(' ')
      : '등록된 JD 키워드가 없습니다.';

  const name =
    c.name || '이름 없음';

  const jobTitle =
    j?.title || '지원공고 없음';

  const careerYears =
    Number(c.years) || 0;

  const score =
    Number(result.score) || 0;

  const recommendation =
    score >= 75
      ? '추천'
      : score >= 50
        ? '검토'
        : '보류';

  const page =
    $('#page');

  if(!page){
    return;
  }

  page.innerHTML = `

    <div class="card">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:12px;
          margin-bottom:18px;
          flex-wrap:wrap;
        "
      >

        <div>

          <div
            style="
              font-size:22px;
              font-weight:800;
              margin-bottom:5px;
            "
          >
            ${escapeHtml(name)}
          </div>

          <div
            style="
              color:#666;
              font-size:14px;
            "
          >
            ${escapeHtml(jobTitle)}
          </div>

        </div>

        <div
          style="
            font-size:30px;
            font-weight:900;
          "
        >
          ${score}점
        </div>

      </div>


      <div
        style="
          display:grid;
          grid-template-columns:
            repeat(4,minmax(0,1fr));
          gap:10px;
          margin-bottom:20px;
        "
      >

        <div class="stat">
          <div class="stat-label">ATS 점수</div>
          <div class="stat-value">${score}</div>
        </div>

        <div class="stat">
          <div class="stat-label">경력</div>
          <div class="stat-value">
            ${careerYears}년
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">경력 적합도</div>
          <div class="stat-value">
            ${result.base || 0}
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">추천</div>
          <div class="stat-value">
            ${recommendation}
          </div>
        </div>

      </div>


      <!-- 지원자 핵심 요약 -->

      <div
        class="card"
        style="
          margin-bottom:16px;
        "
      >

        <h3>지원자 핵심 요약</h3>

        <div
          style="
            white-space:pre-wrap;
            line-height:1.7;
          "
        >
          ${escapeHtml(coreSummary)}
        </div>

      </div>


      <!-- 주요 경력 -->

        </div>

      </div>


      <!-- 핵심 역량 -->

      <div
        class="card"

        <div

      <!-- JD 키워드 -->

        class="card"
        style="
          margin-bottom:16px;
        "
      >

        <h3>채용공고 핵심 키워드</h3>

          style="

            flex-wrap:wrap;
            gap:6px;
          "
        >
          ${jdKeywordHtml}
        </div>

      </div>


      <!-- ATS 분석 -->

      <div
        class="card"
        style="
          margin-bottom:16px;

      >

        <h3>ATS 분석 결과</h3>

          style="

/* ============================================================
   리포트
   ============================================================ */

function renderReports(){

  const reports =
    state.jobs.map(
      j=>{

        const cs =
          state.candidates.filter(
            c=>c.job===j.id
          );

        return {

          ...j,

          n:cs.length,

          avg:
            Math.round(
              cs.reduce(
                (a,c)=>
                  a+(Number(c.score)||0),
                0
              ) /
              Math.max(
                1,
                cs.length
              )
            ),

          high:
            cs.filter(
              c=>(Number(c.score)||0)>=85
            ).length

        };

      }
    );


  $('#page').innerHTML = `

    <div class="title-row">

      <div>

        <h2>리포트</h2>

        <div class="muted mini">
          채용공고별 ATS 지표를 비교합니다.
        </div>

      </div>

      <button
        class="btn"
        onclick="toast('CSV 리포트 기능은 다음 확장 모듈에 연결할 수 있습니다.')"
      >
        CSV 내보내기
      </button>

    </div>


    <div class="card">

      ${
        reports.length

        ?

        `<table class="table">

          <thead>

            <tr>
              <th>공고</th>
              <th>지원자</th>
              <th>평균 ATS</th>
              <th>85점+ 후보</th>
              <th>진행</th>
            </tr>

          </thead>

          <tbody>

          ${
            reports.map(
              j=>`

              <tr>

                <td>

                  <b>
                    ${esc(j.title)}
                  </b>

                  <div class="muted mini">
                    ${esc(j.dept)}
                  </div>

                </td>

                <td>
                  ${j.n}
                </td>

                <td>

                  <b class="score ${
                    j.avg>=85
                      ? 'good'
                      : j.avg>=70
                        ? 'mid'
                        : 'low'
                  }">

                    ${j.avg}

                  </b>

                </td>

                <td>
                  ${j.high}
                </td>

                <td>

                  <span class="badge ${
                    j.status==='진행중'
                      ? 'b-green'
                      : 'b-gray'
                  }">

                    ${esc(
                      j.status ||
                      ''
                    )}

                  </span>

                </td>

              </tr>

              `
            ).join('')
          }

          </tbody>

        </table>`

        :

        `<div class="empty">
          등록된 채용공고가 없습니다.
        </div>`
      }

    </div>

  `;

}

function saveJob(id){

  const o = {

    id:
      id ||
      Date.now(),

    title:
      $('#jtitle').value.trim(),

    dept:
      $('#jdept').value.trim(),

    location:
      $('#jloc').value.trim(),

    status:
      '진행중',

    open:
      $('#jopen').value,

    close:
      $('#jclose').value,

    jd:
      $('#jjd').value,

    keywords:
      $('#jkeys')
        .value
        .split(/[,\n]+/)
        .map(
          x=>x.trim()
        )
        .filter(Boolean)

  };


  if(!o.title){

    toast(
      '공고명을 입력해주세요.'
    );

    return;

  }


  if(id){

    state.jobs =
      state.jobs.map(
        j=>
          j.id===id
            ? o
            : j
      );

  }else{

    state.jobs.push(o);

  }


  save();

  closeModal();

  render();

  toast(
    '채용공고가 저장되었습니다.'
  );

}

/* ============================================================
   PDF 업로드
   ============================================================ */

async function handleResumePdf(file){

  if(!file)
    return;


  if(
    file.type !== 'application/pdf' &&
    !/\.pdf$/i.test(file.name)
  ){

    toast(
      'PDF 파일만 업로드할 수 있습니다.'
    );

    return;

  }


  if(
    file.size >
    20 * 1024 * 1024
  ){

    toast(
      'PDF는 20MB 이하로 업로드하세요.'
    );

    return;

  }


  const status =
    $('#fileStatus');


  status.innerHTML = `

    <div class="file-pill">

      <span>
        📄 ${esc(file.name)}
      </span>

      <span class="ai-status">
        PDF 읽는 중…
      </span>

    </div>

  `;


  try{

    let text = '';

    try{

      text =
        await extractPdfText(
          file
        );

    }catch(pdfErr){

      console.warn(
        'PDF.js text extraction skipped:',
        pdfErr
      );

    }


    $('#cres').value =
      text;


    const f =
      estimateResumeFields(
        text
      );


    if(f.email)
      $('#cemail').value =
        f.email;


    if(f.years)
      $('#cyears').value =
        f.years;


    status.innerHTML = `

      <div class="file-pill">

        <span>
          📄 ${esc(file.name)}
        </span>

        <span class="ai-status">
          PDF 확인 완료 · Gemini 자동 분석 중…
        </span>

      </div>

    `;


    await analyzeCurrentResume(
      true,
      file.name,
      file
    );


  }catch(e){

    console.error(e);

    status.innerHTML = `

      <div
        class="notice"
        style="
          background:#fef2f2;
          color:#b91c1c
        "
      >

        <b>
          분석 실패
        </b>

        <br>

        ${esc(
          e.message ||
          'PDF 처리 중 오류가 발생했습니다.'
        )}

      </div>

    `;

  }

}


/* ============================================================
   Gemini 현재 이력서 분석
   ============================================================ */

async function analyzeCurrentResume(
  silent=false,
  fileName='',
  file=null
){

  const text =
    $('#cres')?.value?.trim();


  if(!text && !file){

    toast(
      '먼저 PDF를 업로드하거나 이력서 원문을 입력하세요.'
    );

    return;

  }


  const apiKey =
    getGeminiApiKey();


  if(!apiKey){

    if(fileName){

      $('#fileStatus').innerHTML = `

        <div
          class="notice"
          style="
            background:#fff7ed;
            color:#9a3412
          "
        >

          <b>
            Gemini API Key가 없습니다.
          </b>

          <br>

          index.html 상단의
          GEMINI_API_KEY에 API Key를 입력한 뒤
          다시 업로드하세요.

        </div>

      `;

    }else{

      openAISettings();

    }

    return;

  }


  try{

    const status =
      $('#fileStatus');


    if(status){

      status.innerHTML = `

        <div class="file-pill">

          <span>
            📄 ${esc(
              fileName ||
              '이력서.pdf'
            )}
          </span>

          <span
            class="ai-status"
            style="color:#7c3aed"
          >
            ✨ Gemini 분석 중…
          </span>

        </div>

      `;

    }


    const job =
      state.jobs.find(
        x=>x.id===+
          ($('#cjob')?.value || 0)
      );


    const r =
      await analyzeResumeWithGemini(
        text,
        job?.jd || '',
        file
      );


    if(!r)
      return;


    /*
      기본 정보
    */

    if(r.name)
      $('#cname').value =
        r.name;


    if(r.email)
      $('#cemail').value =
        r.email;


    if(r.phone)
      $('#cphone').value =
        r.phone;


    if(
      r.years !== undefined &&
      r.years !== null
    ){

      $('#cyears').value =
        Number(r.years) || 0;

    }


    if(r.education)
      $('#cedu').value =
        r.education;


    /*
      스킬
    */

    if(
      Array.isArray(r.skills) &&
      r.skills.length
    ){

      $('#cskills').value =
        r.skills.join(', ');

    }


    /*
      지원자 핵심 요약
    */

    if(r.careerSummary)
      $('#ccareerSummary').value =
        r.careerSummary;


    /*
      기존 resumeSummary가 있으면
      AI 핵심 요약으로 사용
    */

    if(r.resumeSummary)
      $('#csummary').value =
        r.resumeSummary;


    /*
      주요 경력
      저장할 때 다시 구조화할 수 있도록
      화면에는 사람이 읽기 좋은 형태로 표시
    */

    if(
      Array.isArray(r.keyCareers) &&
      r.keyCareers.length
    ){

      $('#ccareer').value =
        r.keyCareers
          .map(
            x =>
              [
                x.company || '',
                x.position || '',
                x.period || ''
              ]
              .filter(Boolean)
              .join(' | ')
              +
              (
                x.description
                  ? '\n' + x.description
                  : ''
              )
          )
          .join('\n\n');

    }


    if(status){

      status.innerHTML = `

        <div class="file-pill">

          <span>
            📄 ${esc(
              fileName ||
              '이력서.pdf'
            )}
          </span>

          <span
            class="ai-status"
            style="color:#15803d"
          >
            ✓ Gemini 분석 완료
          </span>

        </div>

        <div
          class="mini"
          style="
            margin-top:8px;
            color:#15803d
          "
        >
          이력서 내용을 기반으로 지원자 정보를 자동 입력했습니다.
          내용을 확인하고 필요한 경우 수정해주세요.
        </div>

      `;

    }


    toast(
      'Gemini 분석이 완료되었습니다.'
    );


  }catch(e){

    console.error(e);


    const status =
      $('#fileStatus');


    if(status){

      status.innerHTML = `

        <div
          class="notice"
          style="
            background:#fef2f2;
            color:#b91c1c
          "
        >

          <b>
            Gemini 분석 실패
          </b>

          <br>

          ${esc(
            e.message ||
            'API 호출 중 오류가 발생했습니다.'
          )}

        </div>

      `;

    }


    toast(
      'Gemini 분석 실패: ' +
      e.message
    );

  }

}


/* ============================================================
   지원자 저장
   ============================================================ */

function saveCandidate(id){

  const jobId =
    +$('#cjob').value;


  const job =
    state.jobs.find(
      x=>x.id===jobId
    );


  if(!job){

    toast(
      '먼저 채용공고를 등록해주세요.'
    );

    return;

  }


  const existing =
    id
      ? state.candidates.find(
          x=>x.id===id
        )
      : null;


  /*
    주요 경력 텍스트를
    저장 가능한 배열 형태로 변환
  */

  const careerText =
    $('#ccareer')?.value?.trim() ||
    '';


  const keyCareers =
    careerText

      ? careerText
          .split(/\n\s*\n/)
          .map(
            block=>{

              const lines =
                block
                  .split('\n')
                  .map(
                    x=>x.trim()
                  )
                  .filter(Boolean);


              const header =
                lines[0] || '';


              const parts =
                header
                  .split('|')
                  .map(
                    x=>x.trim()
                  );


              return {

                company:
                  parts[0] || '',

                position:
                  parts[1] || '',

                period:
                  parts[2] || '',

                description:
                  lines
                    .slice(1)
                    .join(' ')
                    .trim()

              };

            }
          )
          .filter(
            x =>
              x.company ||
              x.position ||
              x.period ||
              x.description
          )

      : [];


  const c = {

    id:
      id ||
      Date.now(),


    job:
      jobId,


    name:
      $('#cname').value.trim(),


    email:
      $('#cemail').value.trim(),


    phone:
      $('#cphone')?.value.trim() ||
      '',


    stage:
      existing
        ? Number(existing.stage)||0
        : 0,


    years:
      +$('#cyears').value || 0,


    education:
      $('#cedu').value.trim(),


    skills:
      $('#cskills')
        .value
        .split(/[，,\n]+/)
        .map(
          x=>x.trim()
        )
        .filter(Boolean),


    /*
      이력서 원문
    */

    resume:
      $('#cres').value.trim(),


    /*
      지원자 핵심 요약
    */

    resumeSummary:
      $('#csummary').value.trim(),


    /*
      전체 경력 요약
    */

    careerSummary:
      $('#ccareerSummary')?.value.trim() ||
      '',


    /*
      주요 경력 구조화 데이터
    */

    keyCareers:
      keyCareers,


    /*
      주요 경력 표시용 텍스트
      기존 데이터 호환을 위해 유지
    */

    careerDetail:
      careerText,


    rejectReason:
      $('#creason')?.value ||
      '',


    updated:
      '방금 전'

  };


  /*
    기존 ATS 계산 기능 유지
  */

  const a =
    computeAnalysis(
      c,
      job
    );


  c.score =
    a.score;


  /*
    수정
  */

  if(id){

    state.candidates =
      state.candidates.map(
        x=>
          x.id===id
            ? c
            : x
      );

  }else{

    /*
      신규 지원자는 누적
    */

    state.candidates.push(c);

  }


  save();

  closeModal();

  state.page =
    'candidates';

  render();


  toast(
    `지원자 저장 완료 · ATS ${c.score}점`
  );

}

/* ============================================================
   채용공고 삭제
   ============================================================ */

function deleteJob(id){

  const j =
    state.jobs.find(
      x=>x.id===id
    );

  if(!j)
    return;


  const count =
    state.candidates.filter(
      c=>c.job===id
    ).length;


  const message =

    `채용공고 "${j.title}"을(를) 삭제하시겠습니까?\n\n` +

    `연결된 지원자 ${count}명도 함께 삭제됩니다.\n\n` +

    `이 작업은 되돌릴 수 없습니다.`;


  if(
    !confirm(message)
  )
    return;


  state.jobs =
    state.jobs.filter(
      x=>x.id!==id
    );


  state.candidates =
    state.candidates.filter(
      c=>c.job!==id
    );


  if(
    String(state.jobFilter) ===
    String(id)
  ){

    state.jobFilter =
      'all';

  }


  save();

  render();

  toast(
    '채용공고와 연결 지원자가 삭제되었습니다.'
  );

}


/* ============================================================

function deleteCandidate(id){

  const c =
    state.candidates.find(
      x=>x.id===id

  if(!c)

  if(
    !confirm(
      `지원자 "${c.name || '이름 미확인'}"을(를) 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`

  state.candidates =

  state.page =

  render();

  toast(
    '지원자가 삭제되었습니다.'
  );

}

    height: 42px;
    border: 0;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 22px;
    cursor: pointer;
    position: relative;
    z-index: 10001;
  }

  .mobile-menu {
    position: fixed;
    top: 70px;
    left: 10px;
    right: 10px;
    z-index: 10000;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }

  .mobile-menu.open {
    display: block !important;
  }

  .mobile-menu button {
    display: block;
    width: 100%;
    padding: 14px;
    border: 0;
    background: transparent;
    text-align: left;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
  }

  .mobile-menu button:active {
    background: #f3f4f6;
  }

}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {

  const btn = document.getElementById('mobileMenuBtn');
  const menu = document.getElementById('mobileMenu');

  if (!btn || !menu) return;

  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();

    menu.classList.toggle('open');
  });

  menu.querySelectorAll('button').forEach(function (button) {

    button.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();

      const page = button.dataset.page;

      if (typeof go === 'function') {
        go(page);
      }

      menu.classList.remove('open');
    });

  });

});
</script>
  
</body>
</html>
